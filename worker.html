<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a2a6e"><title>Pointage · Espace employé</title>
<style>
:root{--b1:#061a4a;--b2:#0d3a9a;--ink:#14213d;--mut:#6b7a99;--line:#e6ecf7;--acc:#ff6a1a;--ok:#1f9d55;--ko:#d93a3a;--soft:#f1f5ff;--sh:0 10px 30px rgba(3,15,50,.28)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%}
body{font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);background:linear-gradient(160deg,var(--b1),var(--b2)) fixed;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
#app{max-width:560px;margin:0 auto;padding:16px 14px 40px}
.top{display:flex;align-items:center;gap:10px;color:#fff;margin-bottom:16px}.brand{flex:1;font-size:20px;font-weight:800}
.logo{display:inline-flex;width:40px;height:40px;border-radius:12px;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--acc),#ff9a5a);margin-inline-end:8px}
.card{background:#fff;border-radius:22px;padding:18px;margin-bottom:14px;box-shadow:var(--sh)}
label{display:block;font-size:12px;font-weight:600;color:var(--mut);margin:12px 0 5px}
input,textarea,select{width:100%;font:inherit;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:#fbfcff}
.btn{border:0;border-radius:14px;padding:13px 18px;font:inherit;font-weight:700;color:#fff;background:#1d5fd6;cursor:pointer;width:100%;margin-top:12px}.btn.acc{background:linear-gradient(135deg,var(--acc),#ff8a3d)}.btn.s{width:auto;padding:8px 14px;font-size:13px;margin:0}.btn.g{background:rgba(255,255,255,.15);color:#fff}
.av{width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,#1d5fd6,#5b8cff);color:#fff;font-weight:800;font-size:20px;display:flex;align-items:center;justify-content:center;flex:none}
.sub{font-size:12.5px;color:var(--mut)}.big{font-size:34px;font-weight:800;color:var(--b2)}
.ban{background:#fde4e4;color:var(--ko);border-radius:16px;padding:12px 14px;margin-bottom:14px;font-weight:600}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.hd{font-size:11px;font-weight:700;color:var(--mut);text-align:center}
.c{min-height:48px;border-radius:12px;background:var(--soft);text-align:center;font-size:10.5px;padding:4px 2px}.c b{display:block;font-size:15px}.c.w{background:#dff5e8;color:var(--ok)}.c.a{background:#fde4e4;color:var(--ko)}.c.f{opacity:.4}.c.z{visibility:hidden}
.ab{border-top:1px solid var(--line);padding:12px 0}.ab:first-child{border:0}
.toast{position:fixed;left:12px;right:12px;top:calc(env(safe-area-inset-top,0px) + 10px);z-index:30;padding:16px;border-radius:16px;text-align:center;color:#fff;font-weight:800;font-size:18px;display:none}.toast.ok{background:var(--ok)}.toast.ko{background:var(--ko)}
</style></head><body><div id="toast" class="toast"></div><div id="app"></div>
<script>
"use strict";
var L={fr:{t:"Espace employé",mat:"Matricule",pw:"Mot de passe",go:"Connexion",out:"Déconnexion",scan:"📲 Pointer avec ma carte NFC",today:"Aujourd'hui",inn:"Entrée",sor:"Sortie",none:"Pas encore de pointage",na:"NFC indisponible (Chrome Android requis)",bad:"Cette carte n'est pas la vôtre ✗",ok_in:"✓ Entrée enregistrée",ok_out:"✓ Sortie enregistrée",abs:"Absences à justifier",send:"Envoyer le justificatif",why:"Motif de l'absence…",sent:"Justificatif envoyé ✓",saved:"Justificatif envoyé",hours:"Heures",days:"Jours travaillés",web:"Pointer (entrée / sortie)",far:"Vous êtes trop loin du site",geo:"Activez la localisation du navigateur",rem:"🔔 Activer les rappels",remo:"Rappels activés",ab1:"Vous étiez absent le",ab2:"Envoyez un justificatif.",err:"Erreur",login:"Matricule ou mot de passe incorrect",cfg:"Lien invalide : demandez le lien à l'administrateur",lun:"L,M,M,J,V,S,D",h:"h",per:"Période",nab:"Aucune absence 👍"},
ar:{t:"فضاء العامل",mat:"الماتريكول",pw:"كلمة السر",go:"دخول",out:"خروج",scan:"📲 بوانتي بكارطة NFC متاعي",today:"اليوم",inn:"دخول",sor:"خروج",none:"ما بوانتيتش بعد",na:"NFC موش متوفر (لازم Chrome أندرويد)",bad:"هاذي موش كارطتك ✗",ok_in:"✓ تسجّل الدخول",ok_out:"✓ تسجّل الخروج",abs:"غيابات تستنى التبرير",send:"ابعث التبرير",why:"سبب الغياب…",sent:"التبرير تبعث ✓",saved:"التبرير تبعث",hours:"الساعات",days:"أيام الخدمة",web:"بوانتي (دخول / خروج)",far:"أنت بعيد برشا على بلاصة الخدمة",geo:"فعّل الموقع (GPS) في المتصفح",rem:"🔔 فعّل التذكير",remo:"التذكير مفعّل",ab1:"غبت نهار",ab2:"ابعث تبرير.",err:"مشكل",login:"الماتريكول ولا كلمة السر غالطين",cfg:"الرابط غالط: اطلب الرابط من الأدمين",lun:"إ,ث,أ,خ,ج,س,ح",h:"س",per:"الفترة",nab:"ما عندك حتى غياب 👍"}};
var lang=localStorage.getItem("w_lang")||"ar",cfg={pid:"",key:""},S={tk:"",at:0},U={},$a=document.getElementById("app");
(function(){var h=decodeURIComponent(location.hash.slice(1)).split("|");if(h.length===2&&h[0]&&h[1]){cfg={pid:h[0],key:h[1]};localStorage.setItem("w_cfg",JSON.stringify(cfg))}else{try{cfg=JSON.parse(localStorage.getItem("w_cfg")||"{}")}catch(e){}}})();
function t(k){return L[lang][k]||k}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function pad(n){return String(n).padStart(2,"0")}
function dIso(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function nowHM(){var d=new Date();return pad(d.getHours())+":"+pad(d.getMinutes())}
function mins(a,b){var x=(+b.slice(0,2))*60+(+b.slice(3,5))-(+a.slice(0,2))*60-(+a.slice(3,5));return x<0?x+1440:x}
function toast(ok,m){var e=document.getElementById("toast");e.className="toast "+(ok?"ok":"ko");e.textContent=m;e.style.display="block";clearTimeout(toast.x);toast.x=setTimeout(function(){e.style.display="none"},3500)}
function base(){return"https://firestore.googleapis.com/v1/projects/"+encodeURIComponent(cfg.pid)+"/databases/(default)/documents"}
async function tok(){
 if(S.tk&&Date.now()-S.at<3000000)return S.tk;
 var rt=localStorage.getItem("w_rt");
 if(rt){var q=await fetch("https://securetoken.googleapis.com/v1/token?key="+encodeURIComponent(cfg.key),{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},body:"grant_type=refresh_token&refresh_token="+encodeURIComponent(rt)});if(q.ok){var j=await q.json();S.tk=j.id_token;S.at=Date.now();localStorage.setItem("w_rt",j.refresh_token);return S.tk}}
 if(!S.pw)throw new Error("login");
 var r=await fetch("https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key="+encodeURIComponent(cfg.key),{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email:S.mat+"@pointage.app",password:S.pw,returnSecureToken:true})});
 if(!r.ok)throw new Error("login");var k=await r.json();S.tk=k.idToken;S.at=Date.now();localStorage.setItem("w_rt",k.refreshToken);return S.tk}
async function api(m,u,b){var r=await fetch(u,{method:m,headers:{"Content-Type":"application/json","Authorization":"Bearer "+await tok()},body:b?JSON.stringify(b):undefined});if(r.status===404)return null;if(!r.ok)throw new Error("HTTP "+r.status);return r.json()}
function dec(d){var o={},f=d.fields||{};Object.keys(f).forEach(function(k){o[k]=f[k].stringValue||""});o.id=d.name.split("/").pop();return o}
function put(path,o){var f={},m=Object.keys(o).map(function(k){f[k]={stringValue:String(o[k])};return"updateMask.fieldPaths="+k}).join("&");return api("PATCH",base()+"/"+path+"?"+m,{fields:f})}
async function many(col,uid,days){var nm=days.map(function(d){return"projects/"+cfg.pid+"/databases/(default)/documents/"+col+"/"+uid+"_"+d}),j=await api("POST",base()+":batchGet",{documents:nm}),o={};(j||[]).forEach(function(x){if(x.found){var d=dec(x.found);o[d.date]=d}});return o}
function fail(e){var m=String(e&&e.message||e);toast(false,m==="login"?t("login"):t("err")+" "+m)}
function top(o){return'<div class="top"><div class="brand"><span class="logo">⏱</span>'+t("t")+'</div><select style="width:auto;padding:6px" onchange="lang=this.value;localStorage.setItem(\'w_lang\',lang);draw()"><option value="ar"'+(lang==="ar"?" selected":"")+'>ع</option><option value="fr"'+(lang==="fr"?" selected":"")+'>FR</option></select>'+(o?'<button class="btn s g" onclick="logout()">'+t("out")+'</button>':'')+'</div>'}
function draw(){document.documentElement.dir=lang==="ar"?"rtl":"ltr";U.w?home():login()}
function login(){
 if(!cfg.pid||!cfg.key){$a.innerHTML=top(0)+'<div class="ban">'+t("cfg")+'</div>';return}
 $a.innerHTML=top(0)+'<div class="card"><label>'+t("mat")+'</label><input id="m" autocapitalize="off"><label>'+t("pw")+'</label><input id="p" type="password"><button class="btn acc" onclick="doLogin()">'+t("go")+'</button></div>'}
async function doLogin(){S.mat=document.getElementById("m").value.trim().toLowerCase();S.pw=document.getElementById("p").value;S.tk="";localStorage.removeItem("w_rt");localStorage.setItem("w_mat",S.mat);try{await boot()}catch(e){fail(e)}}
function logout(){localStorage.removeItem("w_rt");S={tk:"",at:0};U={};draw()}
async function boot(){
 S.mat=S.mat||localStorage.getItem("w_mat")||"";
 var a=await api("GET",base()+"/accounts/"+S.mat);if(!a)throw new Error("login");U.uid=dec(a).uid;
 var w=await api("GET",base()+"/workers/"+U.uid);if(!w)throw new Error("login");U.w=dec(w);await refresh();draw()}
function period(){var n=new Date(),m=n.getMonth()+1,y=n.getFullYear();if(n.getDate()>=27){m++;if(m>12){m=1;y++}}var a=new Date(y,m-2,27),b=new Date(y,m-1,26),o=[];for(var d=new Date(a);d<=b;d.setDate(d.getDate()+1))o.push(dIso(d));return o}
async function refresh(){
 var days=period();U.days=days;U.att=await many("attendance",U.uid,days);U.jus=await many("justifs",U.uid,days);
 var td=dIso(new Date()),st=U.w.start||"0000",ab=[];
 days.forEach(function(d){var dw=new Date(d+"T12:00:00").getDay();if(d<td&&d>=st&&dw!==0&&dw!==6&&!(U.att[d]&&U.att[d].in))ab.push(d)});
 U.ab=ab;var pend=ab.filter(function(d){return!U.jus[d]});
 if(pend.length&&window.Notification&&Notification.permission==="granted")try{new Notification("Pointage",{body:t("ab1")+" "+pend[pend.length-1]+". "+t("ab2")})}catch(e){}}
setInterval(function(){if(U.w&&!document.hidden)refresh().then(draw).catch(function(){})},1800000);
function home(){
 var w=U.w,td=dIso(new Date()),a=U.att[td]||{},tH=0,wk=0;U.days.forEach(function(d){var x=U.att[d];if(x&&x.in){wk++;tH+=mins(x.in,x.out||(d===td?nowHM():x.in))/60}});
 var ini=(w.name||"?").split(/\s+/).map(function(x){return x[0]}).slice(0,2).join("").toUpperCase(),pend=U.ab.filter(function(d){return!U.jus[d]});
 var lead=(new Date(U.days[0]+"T12:00:00").getDay()+6)%7,cal=t("lun").split(",").map(function(x){return'<div class="hd">'+x+'</div>'}).join("");for(var i=0;i<lead;i++)cal+='<div class="c z"></div>';
 U.days.forEach(function(d){var x=U.att[d],k=x&&x.in?"w":U.ab.indexOf(d)>=0?"a":"f";cal+='<div class="c '+k+'"><b>'+(+d.slice(8))+'</b>'+(k==="w"?(mins(x.in,x.out||x.in)/60).toFixed(1)+t("h"):k==="a"?(U.jus[d]?"📝":"✗"):"")+'</div>'});
 var abh=U.ab.slice().reverse().map(function(d){var j=U.jus[d];return'<div class="ab"><b>'+d+'</b>'+(j?'<div class="sub">📝 '+esc(j.text)+' ✓</div>':'<textarea id="j_'+d+'" rows="2" placeholder="'+t("why")+'"></textarea><button class="btn s acc" style="margin-top:8px" onclick="sendJ(\''+d+'\')">'+t("send")+'</button>')+'</div>'}).join("");
 $a.innerHTML=top(1)+'<div class="card" style="display:flex;gap:14px;align-items:center"><div class="av">'+esc(ini)+'</div><div><b style="font-size:18px">'+esc(w.name)+'</b><div class="sub">'+t("mat")+': '+esc(w.mat)+'</div></div></div>'
 +(pend.length?'<div class="ban">🔔 '+t("ab1")+' '+pend.slice(-1)[0]+(pend.length>1?' (+'+(pend.length-1)+')':'')+'. '+t("ab2")+'</div>':'')
 +'<div class="card"><div class="sub">'+t("today")+'</div><div class="big">'+(a.in?esc(a.in.slice(0,5))+(a.out?' → '+esc(a.out.slice(0,5)):' →'):'—')+'</div><div class="sub">'+(a.in?t("inn")+(a.out?" / "+t("sor"):""):t("none"))+'</div>'+("NDEFReader" in window?'<button class="btn acc" onclick="nfc()">'+t("scan")+'</button>':'')+'<button class="btn'+("NDEFReader" in window?'':' acc')+'" onclick="webPunch()">📍 '+t("web")+'</button>'+((window.Notification&&Notification.permission!=="granted")?'<button class="btn g" style="background:#eef3ff;color:var(--b2)" onclick="rem()">'+t("rem")+'</button>':'')+'</div>'
 +'<div class="card"><div style="display:flex;gap:10px;text-align:center"><div style="flex:1"><div class="big">'+tH.toFixed(1)+'</div><div class="sub">'+t("hours")+'</div></div><div style="flex:1"><div class="big">'+wk+'</div><div class="sub">'+t("days")+'</div></div></div><div class="cal" style="margin-top:14px">'+cal+'</div></div>'
 +'<div class="card"><b>'+t("abs")+'</b>'+(abh||'<div class="sub" style="margin-top:8px">'+t("nab")+'</div>')+'</div>'}
async function sendJ(d){var v=document.getElementById("j_"+d).value.trim();if(!v)return;try{await put("justifs/"+U.uid+"_"+d,{uid:U.uid,date:d,text:v,status:"envoye"});toast(true,t("sent"));await refresh();draw()}catch(e){fail(e)}}
function rem(){Notification.requestPermission().then(function(p){if(p==="granted")toast(true,t("remo"));draw()})}
async function nfc(){
 if(!("NDEFReader" in window)){toast(false,t("na"));return}
 try{var r=new NDEFReader();await r.scan();r.onreading=function(ev){punch((ev.serialNumber||"").replace(/:/g,"").toUpperCase())}}catch(e){toast(false,t("na"))}}
async function punch(s){
 if(s!==U.uid&&s!==(U.w.uid2||"")){toast(false,t("bad"));return}
 doPunch()}
function dist(a,b,c,d){var R=6371000,r=Math.PI/180,x=(c-a)*r,y=(d-b)*r,k=Math.sin(x/2)*Math.sin(x/2)+Math.cos(a*r)*Math.cos(c*r)*Math.sin(y/2)*Math.sin(y/2);return 2*R*Math.asin(Math.sqrt(k))}
async function webPunch(){
 try{var c=await api("GET",base()+"/config/site"),s=c?dec(c):null;
  if(!s||!s.lat){doPunch();return}
  if(!navigator.geolocation){toast(false,t("geo"));return}
  navigator.geolocation.getCurrentPosition(function(p){var d=dist(p.coords.latitude,p.coords.longitude,+s.lat,+s.lng);if(d<=(+s.r||150))doPunch();else toast(false,t("far")+" ("+Math.round(d)+" m)")},function(){toast(false,t("geo"))},{enableHighAccuracy:true,timeout:15000})}catch(e){fail(e)}}
async function doPunch(){
 try{var td=dIso(new Date()),p="attendance/"+U.uid+"_"+td,a=U.att[td];
  if(!a||!a.in){await put(p,{uid:U.uid,date:td,in:nowHM()});toast(true,t("ok_in")+" "+nowHM())}
  else if(a.in.slice(0,5)!==nowHM()){await put(p,{out:nowHM()});toast(true,t("ok_out")+" "+nowHM())}
  await refresh();draw()}catch(e){fail(e)}}
(async function(){if(cfg.pid&&cfg.key&&localStorage.getItem("w_rt")){try{await boot();return}catch(e){}}draw()})();
</script></body></html>
