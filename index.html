/* Firebase REST */
async function tok(){
 if(S.token&&Date.now()-S.at<3000000)return S.token;
 if(!cfg.key)throw new Error("cfg");

 var rt=localStorage.getItem("pt_rt");
 if(rt){var q=await fetch("https://securetoken.googleapis.com/v1/token?key="+encodeURIComponent(cfg.key),{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},body:"grant_type=refresh_token&refresh_token="+encodeURIComponent(rt)});if(q.ok){var qj=await q.json();S.token=qj.id_token;S.at=Date.now();localStorage.setItem("pt_rt",qj.refresh_token);return S.token}}
 if(!S.pw)throw new Error("login");
 var r=await fetch("https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key="+encodeURIComponent(cfg.key),{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email:S.email,password:S.pw,returnSecureToken:true})});
 if(!r.ok)throw new Error("login");var j=await r.json();S.token=j.idToken;S.at=Date.now();localStorage.setItem("pt_rt",j.refreshToken);return S.token}
function base(){return"https://firestore.googleapis.com/v1/projects/"+encodeURIComponent(cfg.pid)+"/databases/(default)/documents"}
async function api(method,url,body){
 var r=await fetch(url,{method:method,headers:{"Content-Type":"application/json","Authorization":"Bearer "+await tok()},body:body?JSON.stringify(body):undefined});
 if(r.status===404)return null;if(!r.ok)throw new Error("HTTP "+r.status);return r.json()}
function enc(o){var f={};Object.keys(o).forEach(function(k){f[k]={stringValue:String(o[k])}});return{fields:f}}
function dec(d){var o={},f=d.fields||{};Object.keys(f).forEach(function(k){o[k]=f[k].stringValue||""});o.id=d.name.split("/").pop();return o}
async function listDocs(col){var out=[],pt="";do{var j=await api("GET",base()+"/"+col+"?pageSize=300"+(pt?"&pageToken="+encodeURIComponent(pt):""));((j&&j.documents)||[]).forEach(function(d){out.push(dec(d))});pt=(j&&j.nextPageToken)||""}while(pt);return out}
async function queryEq(col,field,val){var j=await api("POST",base()+":runQuery",{structuredQuery:{from:[{collectionId:col}],where:{fieldFilter:{field:{fieldPath:field},op:"EQUAL",value:{stringValue:val}}}}});return(j||[]).filter(function(x){return x.document}).map(function(x){return dec(x.document)})}
function setDoc(path,o){var m=Object.keys(o).map(function(k){return"updateMask.fieldPaths="+encodeURIComponent(k)}).join("&");return api("PATCH",base()+"/"+path+"?"+m,enc(o))}
function delDoc(path){return api("DELETE",base()+"/"+path)}
/* calcul */
function toMin(s){var p=String(s).split(":");return(+p[0])*60+(+p[1])}
function mins(a,b){var x=toMin(b)-toMin(a);if(x<0)x+=1440;return x}
function earn(ds,tin,tout,rate){var p=ds.split("-").map(Number),dow=new Date(p[0],p[1]-1,p[2]).getDay(),b=dow===6?1.25:(dow===0?1.75:1),tot=mins(tin,tout),s=toMin(tin),sum=0;
 for(var i=0;i<tot;i++){var md=(s+i)%1440,m=b;if(i>=480)m=Math.max(m,1.25);if(md>=1020)m=Math.max(m,1.25);sum+=m/60}return sum*rate}
/* paie tunisienne : barème IRPP LF 2025 (annuel), CNSS 9,68 %, CSS 0,5 %, frais pro 10 % plafonnés à 2000, chef de famille 300, enfant 100 (max 4) */
var CNSS=.0968,CSSR=.005,BAR=[[5000,0],[10000,.15],[20000,.25],[30000,.30],[40000,.33],[50000,.36],[70000,.38],[1e12,.40]];
function irpp(b){var s=0,p=0;BAR.forEach(function(x){if(b>p)s+=(Math.min(b,x[0])-p)*x[1];p=x[0]});return s}
function pay(brut,w){var cn=brut*CNSS,a=(brut-cn)*12,fp=Math.min(a*.1,2000),fam=(w.chef==="1"?300:0)+Math.min(+w.enf||0,4)*100,bs=Math.max(0,a-fp-fam),ir=irpp(bs)/12,cs=bs*CSSR/12;return{brut:brut,cn:cn,ir:ir,cs:cs,net:brut-cn-ir-cs}}
/* periode 27 -> 26 */
function perRange(y,m){return[new Date(y,m-2,27),new Date(y,m-1,26)]}
function curPer(){var d=new Date(),m=d.getMonth()+1,y=d.getFullYear();if(d.getDate()>=27){m++;if(m>12){m=1;y++}}V.y=y;V.m=m}

/* paie : recap de la periode pour tous */
function calc(w,rec,r){var rate=parseFloat(w.rate)||0,now=new Date(),td=new Date(now.getFullYear(),now.getMonth(),now.getDate()),first=dIso(r[0]),st=(w.start&&w.start>first)?w.start:first,o={h:0,e:0,wk:0,ab:0,days:[]},today=dIso(td);
 for(var d=new Date(r[0]);d<=r[1];d.setDate(d.getDate()+1)){var ds=dIso(d),a=rec[ds],dow=d.getDay(),x={ds:ds,d:new Date(d),k:"f"};
  if(a&&a.in){var end=a.out||(ds===today?nowHM():a.in),hh=mins(a.in,end)/60;o.h+=hh;o.e+=earn(ds,a.in,end,rate);o.wk++;x.k="w";x.h=hh}
  else if(d<=td&&ds>=st&&dow!==0&&dow!==6&&ds!==today){x.k="a";o.ab++}else if(d<=td)x.k="r";
  o.days.push(x)}return o}
