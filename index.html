<style>
:root{--b1:#071f55;--b2:#0d3a9a;--card:#fff;--ink:#14213d;--mut:#6b7a99;--line:#e3e9f5;--acc:#ff6a1a;--ok:#2e7d32;--ko:#c62828;--soft:#eef3ff}
*{box-sizing:border-box}html,body{margin:0;min-height:100%}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);background:radial-gradient(circle,rgba(74,123,224,.55) 2px,transparent 2.5px) 0 0/10px 10px,linear-gradient(160deg,var(--b1),var(--b2)) fixed;padding:env(safe-area-inset-top,0) env(safe-area-inset-right,0) env(safe-area-inset-bottom,0) env(safe-area-inset-left,0)}
#app{max-width:760px;margin:0 auto;padding:14px 14px 40px}
.top{display:flex;align-items:center;gap:10px;margin-bottom:14px;color:#fff}
.brand{font-size:26px;font-weight:800;flex:1}.pill{background:var(--acc);border-radius:999px;padding:2px 14px;font-weight:700}
.tag{color:#cfe0ff;font-size:14px;margin:2px 0 14px}

select.lang{background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.35);border-radius:10px;padding:6px 8px}select.lang option{color:#000}
.btn{border:0;border-radius:12px;padding:11px 16px;font-weight:700;color:#fff;background:#1d5fd6;cursor:pointer}
.btn.ok{background:var(--ok)}.btn.ko{background:var(--ko)}.btn.gray{background:#546e7a}.btn.acc{background:var(--acc)}
.btn.ghost{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.35)}.btn.small{padding:6px 10px;font-size:13px;border-radius:9px}
.card{background:var(--card);border-radius:18px;padding:16px;margin-bottom:12px;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.login{max-width:420px;margin:40px auto 0}
label{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}
input[type=text],input[type=email],input[type=password],input[type=number],input[type=time]{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
details summary{cursor:pointer;color:var(--mut);margin-top:14px}
.tabs{display:flex;gap:8px;margin-bottom:12px}
.tab{flex:1;text-align:center;padding:10px;border-radius:12px;background:rgba(255,255,255,.15);color:#fff;font-weight:700;cursor:pointer;border:1px solid rgba(255,255,255,.3)}.tab.on{background:#fff;color:var(--b1)}
.row{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}.row:last-child{border-bottom:0}
.grow{flex:1;min-width:0}.sub{font-size:13px;color:var(--mut)}
.chip{border-radius:999px;padding:3px 10px;font-size:12px;font-weight:700;color:#fff}.chip.ok{background:var(--ok)}.chip.ko{background:var(--ko)}.chip.gr{background:#78909c}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.stat{background:var(--soft);border-radius:14px;padding:10px;text-align:center}.stat b{display:block;font-size:20px}.stat span{font-size:12px;color:var(--mut)}
.nav{display:flex;align-items:center;gap:10px;justify-content:space-between;color:#fff;margin-bottom:10px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.day.abs{color:var(--ko)}.day.rest{color:var(--mut)}.day.w{color:var(--ok)}
.toast{position:fixed;left:0;right:0;top:0;z-index:20;padding:calc(env(safe-area-inset-top,0px) + 18px) 14px 18px;text-align:center;color:#fff;font-weight:800;font-size:20px;display:none}
.toast.ok{background:var(--ok)}.toast.ko{background:var(--ko)}
.modal{position:fixed;inset:0;z-index:15;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:16px;overflow:auto}
.modal .card{width:100%;max-width:420px;margin:0}
.center{text-align:center;color:#fff}
.fl{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px dashed var(--line)}.fl.t{font-weight:800;border-bottom:0;font-size:18px}
@media print{body>*:not(.modal){display:none!important}.modal{position:static;background:#fff}.actions{display:none}}
</style></head><body>
<div id="toast" class="toast"></div><div id="app"></div>
<script>
"use strict";
var L={
fr:{dir:"ltr",sub:"Suivi de présence des équipes",email:"E-mail",pw:"Mot de passe",login:"Se connecter",server:"Serveur",pid:"Project ID",key:"Web API Key",logout:"Déconnexion",today:"Aujourd'hui",workers:"Travailleurs",point:"Pointage",add:"+ Ajouter",back:"Retour",name:"Nom",mat:"Matricule",rate:"Taux horaire (DT)",badge:"Carte NFC (UID)",scan:"📲 Scanner la carte",save:"Enregistrer",del:"Supprimer",cancel:"Annuler",present:"Présent",absent:"Absent",rest:"Repos",inn:"Entrée",out:"Sortie",h:"h",cur:"DT",hours:"Heures",earn:"Brut",days:"Jours travaillés",abs:"Absences",none:"pas de pointage",edit:"Modifier",clear:"Effacer",saved:"Enregistré ✓",err_login:"E-mail ou mot de passe incorrect",err_net:"Pas de connexion",err_srv:"Erreur serveur",cfg:"Renseignez Project ID et API Key",need:"Nom et carte obligatoires",used:"Carte déjà utilisée",confirm_del:"Supprimer ce travailleur ?",nw:"Aucun travailleur",scan_na:"NFC non disponible (Chrome Android requis)",scanning:"Approchez la carte…",fiche:"Fiche de paie",chef:"Chef de famille",enf:"Enfants à charge (max 4)",yes:"Oui",no:"Non",unknown:"Carte inconnue ✗",matin:"Matricule (si carte oubliée)",go:"Pointer",nfcon:"Activer le lecteur NFC",ent:"✓ Entrée",sor:"✓ Sortie",print:"Imprimer",cnss:"CNSS salariale (9,68 %)",irpp:"IRPP",css:"CSS (0,5 %)",net:"Net à payer",brut:"Salaire brut",prov:"Provisoire",per:"Période",note:"Estimation selon le barème tunisien (LF 2025). À vérifier avec un comptable.",changed:"Carte remplacée ✓",total:"Total"},
ar:{dir:"rtl",sub:"متابعة حضور الفرق",email:"الإيميل",pw:"كلمة السر",login:"دخول",server:"الخادم",pid:"Project ID",key:"Web API Key",logout:"خروج",today:"اليوم",workers:"العمال",point:"البوانتاج",add:"+ إضافة",back:"رجوع",name:"الاسم",mat:"الماتريكول",rate:"سعر الساعة (دينار)",badge:"كارطة NFC (UID)",scan:"📲 سكانّي الكارطة",save:"حفظ",del:"حذف",cancel:"إلغاء",present:"حاضر",absent:"غايب",rest:"راحة",inn:"دخول",out:"خروج",h:"س",cur:"د",hours:"الساعات",earn:"الخام",days:"أيام الخدمة",abs:"غيابات",none:"ما بوانتاش",edit:"تعديل",clear:"مسح",saved:"تسجّل ✓",err_login:"الإيميل ولا كلمة السر غالطين",err_net:"ما فماش إنترنت",err_srv:"مشكل في السيرفر",cfg:"عمّر Project ID و API Key",need:"الاسم والكارطة مطلوبين",used:"الكارطة مستعملة",confirm_del:"تفسخ العامل؟",nw:"ما فما حتى عامل",scan_na:"NFC موش متوفر (لازم Chrome أندرويد)",scanning:"قرّب الكارطة…",fiche:"فيش دي باي",chef:"رب عائلة",enf:"الأطفال (4 كحد أقصى)",yes:"إيه",no:"لا",unknown:"كارطة موش معروفة ✗",matin:"الماتريكول (كان نسى الكارطة)",go:"بوانتي",nfcon:"شغّل قارئ NFC",ent:"✓ دخول",sor:"✓ خروج",print:"طباعة",cnss:"CNSS العامل (9.68٪)",irpp:"IRPP",css:"CSS (0.5٪)",net:"الصافي",brut:"الأجر الخام",prov:"مؤقتة",per:"الفترة",note:"تقدير حسب قانون المالية التونسي 2025. راجعها مع محاسب.",changed:"الكارطة تبدّلت ✓",total:"المجموع"}};
var lang=localStorage.getItem("pt_lang")||"ar",cfg={};
try{cfg=JSON.parse(localStorage.getItem("pt_cfg")||"{}")}catch(e){}
cfg.pid=cfg.pid||"";cfg.key=cfg.key||"";
var S={email:"",pw:"",token:"",at:0},V={view:"login",tab:"today",wid:null,y:0,m:0,workers:[]},$app=document.getElementById("app");
function t(k){return(L[lang]&&L[lang][k])||L.fr[k]||k}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function pad(n){return String(n).padStart(2,"0")}
function iso(y,m,d){return y+"-"+pad(m)+"-"+pad(d)}
function dIso(d){return iso(d.getFullYear(),d.getMonth()+1,d.getDate())}
function todayIso(){return dIso(new Date())}
function nowHM(){var d=new Date();return pad(d.getHours())+":"+pad(d.getMinutes())}
function f2(x){return(Math.round(x*100)/100).toFixed(2)}
function toast(ok,msg){var el=document.getElementById("toast");el.className="toast "+(ok?"ok":"ko");el.textContent=msg;el.style.display="block";clearTimeout(toast.t);toast.t=setTimeout(function(){el.style.display="none"},3500)}
function fail(e){var m=String(e&&e.message||e);
 if(m==="login")toast(false,t("err_login"));else if(m==="cfg")toast(false,t("cfg"));
 else if(/Failed to fetch|NetworkError|Load failed/i.test(m))toast(false,t("err_net"));else toast(false,t("err_srv")+" "+m)}
/* Firebase REST */
async function tok(){
 if(S.token&&Date.now()-S.at<3000000)return S.token;
 if(!cfg.key)throw new Error("cfg");
 var r=await fetch("https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key="+encodeURIComponent(cfg.key),{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email:S.email,password:S.pw,returnSecureToken:true})});
 if(!r.ok)throw new Error("login");var j=await r.json();S.token=j.idToken;S.at=Date.now();return S.token}
function base(){return"https://firestore.googleapis.com/v1/projects/"+encodeURIComponent(cfg.pid)+"/databases/(default)/documents"}
async function api(method,url,body){
 var r=await fetch(url,{method:method,headers:{"Content-Type":"application/json","Authorization":"Bearer "+await tok()},body:body?JSON.stringify(body):undefined});
 if(r.status===404)return null;if(!r.ok)throw new Error("HTTP "+r.status);return r.json()}
function enc(o){var f={};Object.keys(o).forEach(function(k){f[k]={stringValue:String(o[k])}});return{fields:f}}
function dec(d){var o={},f=d.fields||{};Object.keys(f).forEach(function(k){o[k]=f[k].stringValue||""});o.id=d.name.split("/").pop();return o}
async function listDocs(col){var out=[],pt="";do{var j=await api("GET",base()+"/"+col+"?pageSize=300"+(pt?"&pageToken="+encodeURIComponent(pt):""));((j&&j.documents)||[]).forEach(function(d){out.push(dec(d))});pt=(j&&j.nextPageToken)||""}while(pt);return out}
async function queryEq(col,field,val){var j=await api("POST",base()+":runQuery",{structuredQuery:{from:[{collectionId:col}],where:{fieldFilter:{field:{fieldPath:field},op:"EQUAL",value:{stringValue:val}}}}});return(j||[]).filter(function(x){return x.document}).map(function(x){return dec(x.document)})}
function setDoc(path,o){var m=Object.keys(o).map(function(k){return"updateMask.fieldPaths="+encodeURIComponent(k)}).join("&");return api("PATCH",base()+"/"+path+"?"+m,enc(o))}
function delDoc(path){return api("DELETE",base()+"/"+path)}
/* calcul */
function toMin(s){var p=String(s).split(":");return(+p[0])*60+(+p[1])}
function mins(a,b){var x=toMin(b)-toMin(a);if(x<0)x+=1440;return x}
function earn(ds,tin,tout,rate){var p=ds.split("-").map(Number),dow=new Date(p[0],p[1]-1,p[2]).getDay(),b=dow===6?1.25:(dow===0?1.75:1),tot=mins(tin,tout),s=toMin(tin),sum=0;
 for(var i=0;i<tot;i++){var md=(s+i)%1440,m=b;if(i>=480)m=Math.max(m,1.25);if(md>=1020)m=Math.max(m,1.25);sum+=m/60}return sum*rate}
/* paie tunisienne : barème IRPP LF 2025 (annuel), CNSS 9,68 %, CSS 0,5 %, frais pro 10 % plafonnés à 2000, chef de famille 300, enfant 100 (max 4) */
var CNSS=.0968,CSSR=.005,BAR=[[5000,0],[10000,.15],[20000,.25],[30000,.30],[40000,.33],[50000,.36],[70000,.38],[1e12,.40]];
function irpp(b){var s=0,p=0;BAR.forEach(function(x){if(b>p)s+=(Math.min(b,x[0])-p)*x[1];p=x[0]});return s}
function pay(brut,w){var cn=brut*CNSS,a=(brut-cn)*12,fp=Math.min(a*.1,2000),fam=(w.chef==="1"?300:0)+Math.min(+w.enf||0,4)*100,bs=Math.max(0,a-fp-fam),ir=irpp(bs)/12,cs=bs*CSSR/12;return{brut:brut,cn:cn,ir:ir,cs:cs,net:brut-cn-ir-cs}}
/* periode 27 -> 26 */
function perRange(y,m){return[new Date(y,m-2,27),new Date(y,m-1,26)]}
function curPer(){var d=new Date(),m=d.getMonth()+1,y=d.getFullYear();if(d.getDate()>=27){m++;if(m>12){m=1;y++}}V.y=y;V.m=m}
/* vues */
function setLang(v){lang=v;localStorage.setItem("pt_lang",v);render()}
function topBar(o){return'<div class="top"><div class="brand">Pointage <span class="pill">Team</span></div><select class="lang" onchange="setLang(this.value)">'+['ar','fr'].map(function(c){return'<option value="'+c+'"'+(c===lang?' selected':'')+'>'+({ar:'العربية',fr:'Français'})[c]+'</option>'}).join("")+'</select>'+(o?'<button class="btn ghost small" onclick="logout()">'+t("logout")+'</button>':'')+'</div>'}
function render(){document.documentElement.lang=lang;document.documentElement.dir=L[lang].dir;({login:viewLogin,home:viewHome,worker:viewWorker,form:viewForm})[V.view]()}
function viewLogin(){$app.innerHTML=topBar(0)+'<div class="tag">'+t("sub")+'</div><div class="card login"><label>'+t("email")+'</label><input type="email" id="em" value="'+esc(localStorage.getItem("pt_email")||"")+'"><label>'+t("pw")+'</label><input type="password" id="pw"><details'+(cfg.pid&&cfg.key?'':' open')+'><summary>⚙ '+t("server")+'</summary><label>'+t("pid")+'</label><input type="text" id="pid" value="'+esc(cfg.pid)+'"><label>'+t("key")+'</label><input type="text" id="key" value="'+esc(cfg.key)+'"></details><div class="actions"><button class="btn acc" style="flex:1" onclick="doLogin()">'+t("login")+'</button></div></div>'}
async function doLogin(){
 cfg.pid=document.getElementById("pid").value.trim();cfg.key=document.getElementById("key").value.trim();
 S.email=document.getElementById("em").value.trim();S.pw=document.getElementById("pw").value;S.token="";
 localStorage.setItem("pt_cfg",JSON.stringify(cfg));localStorage.setItem("pt_email",S.email);
 if(!cfg.pid||!cfg.key){toast(false,t("cfg"));return}
 try{V.workers=await listDocs("workers");V.view="home";V.tab="today";render()}catch(e){fail(e)}}
function logout(){S={email:"",pw:"",token:"",at:0};V.view="login";render()}
function viewHome(){
 var tb=[["today","today"],["workers","workers"],["point","point"]].map(function(x){return'<div class="tab '+(V.tab===x[0]?'on':'')+'" onclick="setTab(\''+x[0]+'\')">'+t(x[1])+'</div>'}).join("");
 $app.innerHTML=topBar(1)+'<div class="tabs">'+tb+'</div><div id="body"><div class="center">…</div></div>';
 if(V.tab==="today")loadToday();else if(V.tab==="workers")drawWorkers();else drawPoint()}
function setTab(x){V.tab=x;render()}
async function loadToday(){
 try{var td=todayIso(),ws=await listDocs("workers");V.workers=ws;var at=await queryEq("attendance","date",td),by={};at.forEach(function(a){by[a.uid]=a});
 var dow=new Date().getDay(),we=(dow===0||dow===6),pres=ws.filter(function(w){return by[w.id]&&by[w.id].in}).length;
 var rows=ws.slice().sort(function(a,b){return(a.name||"").localeCompare(b.name||"")}).map(function(w){
  var a=by[w.id],chip,info="";
  if(a&&a.in){chip='<span class="chip ok">'+t("present")+'</span>';info=t("inn")+" "+esc(String(a.in).slice(0,5))+(a.out?" — "+t("out")+" "+esc(String(a.out).slice(0,5)):"")}
  else if(we)chip='<span class="chip gr">'+t("rest")+'</span>';else{chip='<span class="chip ko">'+t("absent")+'</span>';info=t("none")}
  return'<div class="row" onclick="openWorker(\''+esc(w.id)+'\')" style="cursor:pointer"><div class="grow"><b>'+esc(w.name)+'</b><div class="sub">'+esc(w.mat)+(info?' · '+info:'')+'</div></div>'+chip+'</div>'}).join("");
 document.getElementById("body").innerHTML='<div class="grid"><div class="stat"><b>'+ws.length+'</b><span>'+t("workers")+'</span></div><div class="stat"><b>'+pres+'</b><span>'+t("present")+'</span></div><div class="stat"><b>'+(we?0:ws.length-pres)+'</b><span>'+t("absent")+'</span></div></div><div class="card">'+(rows||'<div class="sub">'+t("nw")+'</div>')+'</div>'}catch(e){fail(e)}}
function drawWorkers(){
 var ws=V.workers.slice().sort(function(a,b){return(a.name||"").localeCompare(b.name||"")});
 document.getElementById("body").innerHTML='<div class="actions" style="margin:0 0 10px"><button class="btn acc" onclick="openForm(null)">'+t("add")+'</button></div><div class="card">'+(ws.map(function(w){return'<div class="row" onclick="openWorker(\''+esc(w.id)+'\')" style="cursor:pointer"><div class="grow"><b>'+esc(w.name)+'</b><div class="sub">'+t("mat")+': '+esc(w.mat)+' · '+esc(w.rate||"0")+' '+t("cur")+'</div></div><span>›</span></div>'}).join("")||'<div class="sub">'+t("nw")+'</div>')+'</div>'}
/* pointage : carte NFC ou matricule */
function drawPoint(){
 document.getElementById("body").innerHTML='<div class="card"><button class="btn acc" style="width:100%" onclick="nfcPoint()">'+t("nfcon")+'</button><label>'+t("matin")+'</label><input type="text" id="pm"><div class="actions"><button class="btn ok" style="flex:1" onclick="punchMat()">'+t("go")+'</button></div></div>'}
async function nfcPoint(){
 if(!("NDEFReader" in window)){toast(false,t("scan_na"));return}
 try{var r=new NDEFReader();await r.scan();toast(true,t("scanning"));r.onreading=function(ev){punch((ev.serialNumber||"").replace(/:/g,"").toUpperCase())}}catch(e){toast(false,t("scan_na"))}}
function punchMat(){var m=document.getElementById("pm").value.trim(),w=V.workers.filter(function(x){return x.mat===m})[0];if(!w){toast(false,t("unknown"));return}punch(w.id)}
async function punch(id){
 var w=V.workers.filter(function(x){return x.id===id})[0];if(!w){toast(false,t("unknown"));return}
 try{var td=todayIso(),p="attendance/"+id+"_"+td,r=await api("GET",base()+"/"+p),a=r?dec(r):null;
  if(!a||!a.in){await setDoc(p,{uid:id,date:td,in:nowHM()});toast(true,t("ent")+" "+w.name+" "+nowHM())}
  else{await setDoc(p,{out:nowHM()});toast(true,t("sor")+" "+w.name+" "+nowHM())}}catch(e){fail(e)}}
/* travailleur */
function openWorker(id){V.wid=id;curPer();V.view="worker";render()}
var WD={rec:{}};
function shiftMonth(n){var d=new Date(V.y,V.m-1+n,1);V.y=d.getFullYear();V.m=d.getMonth()+1;render()}
function viewWorker(){
 var w=V.workers.filter(function(x){return x.id===V.wid})[0];if(!w){V.view="home";return render()}
 var r=perRange(V.y,V.m),lbl=r[0].toLocaleDateString("fr",{day:"numeric",month:"short"})+" → "+r[1].toLocaleDateString("fr",{day:"numeric",month:"short",year:"numeric"});
 $app.innerHTML=topBar(1)+'<div class="nav"><button class="btn ghost small" onclick="shiftMonth(-1)">‹</button><b>'+esc(w.name)+'<div class="sub" style="color:#cfe0ff">'+lbl+'</div></b><button class="btn ghost small" onclick="shiftMonth(1)">›</button></div><div class="grid" id="stats"></div><div class="card" id="days">…</div><div class="actions"><button class="btn gray" onclick="V.view=\'home\';render()">'+t("back")+'</button><button class="btn" onclick="openForm(\''+esc(w.id)+'\')">'+t("edit")+'</button><button class="btn acc" onclick="showFiche()">'+t("fiche")+'</button></div>';
 loadWorker(w)}
async function loadWorker(w){
 try{var docs=await queryEq("attendance","uid",w.id),rec={};docs.forEach(function(a){rec[a.date]=a});WD.rec=rec;
 var rate=parseFloat(w.rate)||0,today=todayIso(),r=perRange(V.y,V.m),now=new Date(),td=new Date(now.getFullYear(),now.getMonth(),now.getDate()),
 first=dIso(r[0]),start=(w.start&&w.start>first)?w.start:first,last=td<r[1]?td:r[1];
 var tH=0,tE=0,ab=0,wk=0,html="";
 for(var d=new Date(last);dIso(d)>=start;d.setDate(d.getDate()-1)){
  var ds=dIso(d),a=rec[ds],dn=d.toLocaleDateString(lang==="ar"?"ar-TN":"fr",{weekday:"short"}),dow=d.getDay(),cls="",info="";
  if(a&&a.in){var end=a.out||(ds===today?nowHM():a.in),hh=mins(a.in,end)/60,ee=earn(ds,a.in,end,rate);tH+=hh;tE+=ee;wk++;cls="w";
   info=esc(String(a.in).slice(0,5))+" → "+(a.out?esc(String(a.out).slice(0,5)):"…")+" · "+f2(hh)+" "+t("h")+" · "+f2(ee)+" "+t("cur")}
  else if(ds===today){info="—";cls="rest"}else if(dow===0||dow===6){info=t("rest");cls="rest"}else{info=t("absent");cls="abs";ab++}
  html+='<div class="row day '+cls+'"><div class="grow"><b>'+d.getDate()+'/'+(d.getMonth()+1)+' '+esc(dn)+'</b><div class="sub">'+info+'</div></div><button class="btn small gray" onclick="editDay(\''+ds+'\')">✎</button></div>'}
 WD.h=tH;WD.e=tE;WD.w=wk;
 document.getElementById("stats").innerHTML='<div class="stat"><b>'+f2(tH)+'</b><span>'+t("hours")+'</span></div><div class="stat"><b>'+f2(tE)+'</b><span>'+t("earn")+' ('+t("cur")+')</span></div><div class="stat"><b>'+wk+' / '+ab+'</b><span>'+t("days")+' / '+t("abs")+'</span></div>';
 document.getElementById("days").innerHTML=html||'<div class="sub">—</div>'}catch(e){fail(e)}}
function editDay(ds){
 var a=WD.rec[ds]||{},m=document.createElement("div");m.className="modal";
 m.innerHTML='<div class="card"><b>'+esc(ds)+'</b><label>'+t("inn")+'</label><input type="time" id="t_in" value="'+esc(String(a.in||"08:00").slice(0,5))+'"><label>'+t("out")+'</label><input type="time" id="t_out" value="'+esc(String(a.out||"16:00").slice(0,5))+'"><div class="actions"><button class="btn ok" id="d_save">'+t("save")+'</button><button class="btn ko" id="d_clear">'+t("clear")+'</button><button class="btn gray" id="d_cancel">'+t("cancel")+'</button></div></div>';
 document.body.appendChild(m);var close=function(){m.remove()};
 m.querySelector("#d_cancel").onclick=close;
 m.querySelector("#d_save").onclick=async function(){try{await setDoc("attendance/"+V.wid+"_"+ds,{uid:V.wid,date:ds,in:m.querySelector("#t_in").value,out:m.querySelector("#t_out").value});close();toast(true,t("saved"));render()}catch(e){fail(e)}};
 m.querySelector("#d_clear").onclick=async function(){try{await delDoc("attendance/"+V.wid+"_"+ds);close();toast(true,t("saved"));render()}catch(e){fail(e)}}}
/* fiche de paie */
function showFiche(){
 var w=V.workers.filter(function(x){return x.id===V.wid})[0],p=pay(WD.e||0,w),r=perRange(V.y,V.m),done=new Date()>r[1],m=document.createElement("div");m.className="modal";
 var fl=function(a,b,c){return'<div class="fl'+(c?' t':'')+'"><span>'+a+'</span><span>'+f2(b)+' '+t("cur")+'</span></div>'};
 m.innerHTML='<div class="card"><b>'+t("fiche")+' — '+esc(w.name)+'</b>'+(done?'':' <span class="chip gr">'+t("prov")+'</span>')+'<div class="sub">'+t("mat")+': '+esc(w.mat)+' · '+t("per")+': '+dIso(r[0])+' → '+dIso(r[1])+'</div><div class="sub">'+f2(WD.h||0)+' '+t("h")+' · '+(WD.w||0)+' '+t("days")+' · '+esc(w.rate||0)+' '+t("cur")+'/'+t("h")+'</div><div style="margin-top:10px">'+fl(t("brut"),p.brut)+fl(t("cnss"),-p.cn)+fl(t("irpp"),-p.ir)+fl(t("css"),-p.cs)+fl(t("net"),p.net,1)+'</div><div class="sub" style="margin-top:8px">'+t("note")+'</div><div class="actions"><button class="btn" onclick="window.print()">'+t("print")+'</button><button class="btn gray" id="f_x">'+t("cancel")+'</button></div></div>';
 document.body.appendChild(m);m.querySelector("#f_x").onclick=function(){m.remove()}}
/* formulaire */
function viewForm(){
 var w=V.workers.filter(function(x){return x.id===V.wid})[0]||{},e=!!V.edit;
 $app.innerHTML=topBar(1)+'<div class="card"><label>'+t("name")+'</label><input type="text" id="f_name" value="'+esc(e?w.name:"")+'"><label>'+t("mat")+'</label><input type="text" id="f_mat" value="'+esc(e?w.mat:"")+'"><label>'+t("rate")+'</label><input type="number" step="0.001" id="f_rate" value="'+esc(e?w.rate:"")+'"><label>'+t("chef")+'</label><select id="f_chef" style="width:100%;padding:11px"><option value="0">'+t("no")+'</option><option value="1"'+(e&&w.chef==="1"?' selected':'')+'>'+t("yes")+'</option></select><label>'+t("enf")+'</label><input type="number" min="0" max="4" id="f_enf" value="'+esc(e?(w.enf||0):0)+'"><label>'+t("badge")+'</label><input type="text" id="f_uid" value="'+esc(e?w.id:"")+'"><div class="actions"><button class="btn" onclick="scanNfc()">'+t("scan")+'</button></div><div class="actions"><button class="btn ok" onclick="saveWorker()">'+t("save")+'</button>'+(e?'<button class="btn ko" onclick="removeWorker()">'+t("del")+'</button>':'')+'<button class="btn gray" onclick="V.view=\''+(e?'worker':'home')+'\';render()">'+t("cancel")+'</button></div></div>'}
function openForm(id){V.edit=!!id;V.wid=id||null;V.view="form";render()}
async function scanNfc(){
 if(!("NDEFReader" in window)){toast(false,t("scan_na"));return}
 try{var r=new NDEFReader();await r.scan();toast(true,t("scanning"));r.onreading=function(ev){var s=(ev.serialNumber||"").replace(/:/g,"").toUpperCase();if(s){document.getElementById("f_uid").value=s;toast(true,s)}}}catch(e){toast(false,t("scan_na"))}}
async function saveWorker(){
 var g=function(i){return document.getElementById(i).value.trim()},name=g("f_name"),uid=g("f_uid").toUpperCase().replace(/[^0-9A-F]/g,""),
 o={name:name,mat:g("f_mat"),rate:g("f_rate").replace(",","."),chef:g("f_chef"),enf:g("f_enf")||"0"};
 if(!name||!uid){toast(false,t("need"));return}
 try{
  if(!V.edit||uid!==V.wid){if(await api("GET",base()+"/workers/"+uid)){toast(false,t("used"));return}}
  if(!V.edit)o.start=todayIso();
  else if(uid!==V.wid){ /* carte remplacée : on déplace le worker et ses pointages vers le nouvel UID */
   var old=V.workers.filter(function(x){return x.id===V.wid})[0];o.start=old.start||todayIso();
   var at=await queryEq("attendance","uid",V.wid);
   for(var i=0;i<at.length;i++){await setDoc("attendance/"+uid+"_"+at[i].date,{uid:uid,date:at[i].date,in:at[i].in,out:at[i].out});await delDoc("attendance/"+at[i].id)}
   await setDoc("workers/"+uid,o);await delDoc("workers/"+V.wid);toast(true,t("changed"))}
  if(!V.edit||uid===V.wid)await setDoc("workers/"+uid,o);
  V.workers=await listDocs("workers");V.view="home";V.tab="workers";render();toast(true,t("saved"))}catch(e){fail(e)}}
async function removeWorker(){
 if(!confirm(t("confirm_del")))return;
 try{await delDoc("workers/"+V.wid);V.workers=await listDocs("workers");V.view="home";V.tab="workers";render();toast(true,t("saved"))}catch(e){fail(e)}}
render();
</script></body></html>
