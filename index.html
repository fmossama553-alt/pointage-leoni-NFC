<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a2a6e">
<title>Pointage</title>
<style>
:root{--b1:#061a4a;--b2:#0d3a9a;--card:#fff;--ink:#14213d;--mut:#6b7a99;--line:#e6ecf7;--acc:#ff6a1a;--ok:#1f9d55;--ko:#d93a3a;--soft:#f1f5ff;--sh:0 10px 30px rgba(3,15,50,.28)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);background:linear-gradient(160deg,var(--b1),var(--b2)) fixed;padding-bottom:90px}
.top{color:#fff;padding:16px;font-size:20px;font-weight:800;text-align:center}
.wrap{max-width:720px;margin:0 auto;padding:10px 14px}
.hero{text-align:center;color:#fff;margin:30px 0 16px}.hero h1{margin:0;font-size:30px}.hero p{margin:6px 0 0;color:#b9d0ff}
.logo{display:inline-flex;align-items:center;justify-content:center;width:70px;height:70px;border-radius:22px;background:linear-gradient(135deg,var(--acc),#ff9a5a);font-size:34px;margin-bottom:10px}
.card{background:var(--card);border-radius:20px;padding:16px;margin-bottom:14px;box-shadow:var(--sh)}
.card h3{margin:0 0 10px}
input,textarea{width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:12px;margin:6px 0;font:inherit;background:#fbfcff;color:var(--ink)}
textarea{min-height:70px;resize:vertical}
label{display:block;font-size:12px;font-weight:600;color:var(--mut);margin-top:10px}
.btn{width:100%;border:0;border-radius:14px;padding:12px;font:inherit;font-weight:700;color:#fff;background:#1d5fd6;cursor:pointer;margin-top:8px}
.btn.ok{background:var(--ok)}.btn.ko{background:var(--ko)}.btn.gray{background:#586f7c}.btn.acc{background:linear-gradient(135deg,var(--acc),#ff8a3d)}
.small{border:0;border-radius:10px;padding:7px 12px;font:inherit;font-size:13px;color:#fff;background:#1d5fd6;cursor:pointer}
.ghost2{background:#e6ecf7 !important;color:var(--ink) !important}
.who{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.av{flex:none;width:42px;height:42px;border-radius:50%;object-fit:cover;display:inline-flex;align-items:center;justify-content:center;font-weight:800;color:#fff;background:linear-gradient(135deg,#1d5fd6,#5b8cff)}
.av.big{width:70px;height:70px;font-size:26px}
.pimg{width:100%;border-radius:14px;margin:8px 0}
.act{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.cm{background:var(--soft);border-radius:12px;padding:8px 10px;margin:6px 0;font-size:14px}
.row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.row:last-child{border:0}
.grow{flex:1;min-width:0}
.row2{display:flex;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.row2 input{margin:0}
.row2>span{flex:1}
.sub{font-size:12.5px;color:var(--mut)}
.chip{display:inline-block;border-radius:999px;padding:3px 10px;font-size:11px;font-weight:700;background:#8a9bb0;color:#fff}
.big{font-size:32px;font-weight:800;color:var(--b2)}
.center{text-align:center}
.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;background:rgba(6,26,74,.95);padding:6px;z-index:10}
.tab{flex:1;text-align:center;color:#a9c3f5;padding:6px 2px;font-size:11.5px;font-weight:600;border-radius:12px;cursor:pointer}
.tab i{display:block;font-style:normal;font-size:19px}
.tab.on{background:rgba(255,255,255,.15);color:#fff}
.chat{max-height:50vh;overflow:auto;display:flex;flex-direction:column;gap:8px;margin:10px 0;padding:4px}
.bub{align-self:flex-start;background:var(--soft);padding:8px 12px;border-radius:14px;max-width:80%;font-size:14px}
.bub.me{align-self:flex-end;background:#1d5fd6;color:#fff}
.bub.me .sub{color:#dbe7ff}
.bub .act span{cursor:pointer;font-size:12px;text-decoration:underline}
.notice{background:#fff4e5;color:#7a4a00;border-radius:12px;padding:10px;font-size:13px;margin-bottom:6px}
.credit{margin:20px 6px;font-size:12px;line-height:1.7;color:#a9bde8;text-align:center}
.credit b{color:#fff}
.ab{border-top:1px solid var(--line);padding:10px 0}.ab:first-child{border:0}
.toast{position:fixed;left:12px;right:12px;top:12px;background:#14213d;color:#fff;padding:14px;border-radius:14px;text-align:center;display:none;z-index:50;font-weight:700}
summary{cursor:pointer;color:var(--mut);margin-top:12px;font-size:14px}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" class="toast"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
"use strict";
if (typeof firebase === "undefined") {
  document.getElementById("app").innerHTML =
    '<div class="wrap"><div class="card"><b>ما تحمّلتش Firebase.</b>' +
    '<p class="sub">حل الملف من رابط GitHub Pages، وتأكد من الإنترنت.</p></div></div>';
  throw new Error("firebase not loaded");
}

/* ===== إعدادات ===== */
const FIREBASE_CONFIG = {
  apiKey: "API_KEY_متاعك",
  authDomain: "PROJECT_ID.firebaseapp.com",
  projectId: "PROJECT_ID",
  appId: "APP_ID"
};
// إيميل الأدمين (جيميل). تنجم تزيد أكثر من واحد.
const ADMINS = ["oussamabaccouch29@gmail.com"];

firebase.initializeApp(FIREBASE_CONFIG);
const auth = firebase.auth();
const db = firebase.firestore();
const FV = firebase.firestore.FieldValue;
const $app = document.getElementById("app");

/* ===== أدوات ===== */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad = n => String(n).padStart(2, "0");
const todayIso = () => { const d = new Date(); return d.getFullYear() + "-" + pad(d.getMonth()+1) + "-" + pad(d.getDate()); };
const fmt = t => new Date(t).toLocaleString("fr-TN", {dateStyle:"short", timeStyle:"short"});
const toM = s => { const [h, m] = s.split(":").map(Number); return h*60 + m; };
const mins = (a, b) => { let x = toM(b) - toM(a); if (x < 0) x += 1440; return x; };
const hm = m => pad(Math.floor(m/60)) + "h" + pad(m % 60);
const isAdmin = u => !!u && ADMINS.includes((u.email || "").toLowerCase());
const avatar = (a, big) => a && a.photo
  ? `<img class="av ${big ? "big" : ""}" src="${a.photo}">`
  : `<span class="av ${big ? "big" : ""}">${esc(((a && a.name) || "?")[0])}</span>`;

function toast(m) {
  const t = $("#toast");
  t.textContent = m; t.style.display = "block";
  clearTimeout(toast.t);
  toast.t = setTimeout(() => t.style.display = "none", 2600);
}

function shrink(file, max = 300, q = 0.7) {
  return new Promise(res => {
    if (!file) return res("");
    const r = new FileReader();
    r.onload = () => {
      const im = new Image();
      im.onload = () => {
        const k = Math.min(1, max / Math.max(im.width, im.height));
        const c = document.createElement("canvas");
        c.width = im.width * k; c.height = im.height * k;
        c.getContext("2d").drawImage(im, 0, 0, c.width, c.height);
        res(c.toDataURL("image/jpeg", q));
      };
      im.src = r.result;
    };
    r.readAsDataURL(file);
  });
}

/* ===== الدخول ===== */
let ME = null, P = null, TAB = "att", SIGNING = false;

auth.onAuthStateChanged(async u => {
  ME = u;
  if (!u) { P = null; return renderLogin(); }
  if (SIGNING) return;
  const s = await db.collection("users").doc(u.uid).get();
  P = s.exists ? s.data() : null;
  if (P && P.banned) { toast("تم حظر حسابك من الأدمين"); return auth.signOut(); }
  if (!P) return renderSetup();
  TAB = isAdmin(u) ? "adm" : "att";
  render();
});

function gLogin() {
  const pr = new firebase.auth.GoogleAuthProvider();
  pr.setCustomParameters({prompt: "select_account"});
  auth.signInWithRedirect(pr).catch(() => toast("ما تنجمش تدخل بالجيميل"));
}

async function pLogin() {
  try {
    await auth.signInWithEmailAndPassword($("#le").value.trim(), $("#lp").value);
  } catch (e) { toast("الإيميل ولا كلمة السر غالطين"); }
}

async function pSignup() {
  const n = $("#rn").value.trim(), em = $("#re").value.trim(), pw = $("#rp").value;
  if (!n || !em) return toast("الاسم والإيميل مطلوبين");
  if (pw.length < 6) return toast("كلمة السر 6 أحرف على الأقل");
  SIGNING = true;
  try {
    const c = await auth.createUserWithEmailAndPassword(em, pw);
    const doc = {name: n, email: em, photo: "", banned: false, createdAt: Date.now()};
    await db.collection("users").doc(c.user.uid).set(doc);
    ME = c.user; P = doc;
    TAB = isAdmin(ME) ? "adm" : "att";
    SIGNING = false;
    render();
  } catch (e) {
    SIGNING = false;
    toast(e.code === "auth/email-already-in-use" ? "الإيميل مستعمل توا، ادخل مباشرة" : "ما تنجمش تسجّل، عاود");
  }
}

function renderLogin() {
  $app.innerHTML = `<div class="wrap">
    <div class="hero"><div class="logo">⏱</div><h1>Pointage</h1><p>متابعة الحضور والفريق</p></div>
    <div class="card">
      <button class="btn acc" onclick="gLogin()">🔐 دخول بالجيميل</button>
      <details>
        <summary>عندي حساب بالإيميل وكلمة السر</summary>
        <label>الإيميل</label><input id="le" type="email" autocapitalize="off">
        <label>كلمة السر</label><input id="lp" type="password">
        <button class="btn" onclick="pLogin()">دخول</button>
      </details>
      <details>
        <summary>ما عنديش حساب؟ سجّل بالإيميل</summary>
        <label>الاسم واللقب</label><input id="rn">
        <label>الإيميل</label><input id="re" type="email" autocapitalize="off">
        <label>كلمة السر (6 أحرف على الأقل)</label><input id="rp" type="password">
        <button class="btn ok" onclick="pSignup()">سجّل وادخل</button>
      </details>
    </div>
    <div class="credit">تطبيق شخصي من إنشاء <b>Oussama Baccouch</b>، ما عندو حتى علاقة بنظام شركة LEONI.</div>
  </div>`;
}

/* أول دخول بالجيميل: الاسم وكلمة سر اختيارية */
function renderSetup() {
  $app.innerHTML = `<div class="wrap">
    <div class="hero"><h1>أهلا</h1><p>${esc(ME.email)}</p></div>
    <div class="card">
      <label>الاسم واللقب</label><input id="sn" value="${esc(ME.displayName || "")}">
      <label>كلمة سر للدخول بالإيميل (اختيارية، 6 أحرف على الأقل)</label><input id="sp" type="password">
      <button class="btn ok" onclick="saveSetup()">ادخل للتطبيق</button>
    </div>
    <div class="credit">تطبيق شخصي من إنشاء <b>Oussama Baccouch</b>، ما عندو حتى علاقة بنظام شركة LEONI.</div>
  </div>`;
}

async function saveSetup() {
  const n = $("#sn").value.trim(), pw = $("#sp").value;
  if (!n) return toast("الاسم مطلوب");
  if (pw && pw.length < 6) return toast("كلمة السر 6 أحرف على الأقل");
  try {
    const doc = {name: n, email: ME.email || "", photo: ME.photoURL || "", banned: false, createdAt: Date.now()};
    await db.collection("users").doc(ME.uid).set(doc);
    if (pw) {
      try { await ME.linkWithCredential(firebase.auth.EmailAuthProvider.credential(ME.email, pw)); } catch (e) {}
    }
    P = doc;
    TAB = isAdmin(ME) ? "adm" : "att";
    render();
  } catch (e) { toast("ما تنجمش تسجّل، عاود"); }
}

/* ===== الواجهة ===== */
function getTabs() {
  return isAdmin(ME)
    ? [["adm","لوحة","🏠"],["news","أخبار","📰"],["chat","مجموعة","💬"],["rep","شكايات","📩"],["prof","بروفيل","👤"]]
    : [["att","بوانتاج","⏱"],["news","أخبار","📰"],["chat","مجموعة","💬"],["prof","بروفيل","👤"]];
}

function go(k) { TAB = k; render(); }

async function render() {
  if (!ME || !P) return;
  const tabs = getTabs();
  if (!tabs.some(x => x[0] === TAB)) TAB = tabs[0][0];
  const fn = {att: viewAtt, news: viewNews, chat: viewChat, prof: viewProf, adm: viewAdm, rep: viewRep}[TAB];
  let body;
  try { body = await fn(); } catch (e) { body = `<div class="card">خطأ: ${esc(e.message)}</div>`; }
  $app.innerHTML = `<div class="top">Pointage</div><div class="wrap">${body}</div>
    <nav class="tabs">${tabs.map(([k,l,i]) =>
      `<div class="tab ${TAB===k?"on":""}" onclick="go('${k}')"><i>${i}</i>${l}</div>`).join("")}</nav>`;
}

// تحديث تلقائي للمجموعة والأخبار، من غير ما نمسحو الكتابة
setInterval(() => {
  if (!ME || !P || document.hidden) return;
  const a = document.activeElement;
  if (a && ["INPUT", "TEXTAREA"].includes(a.tagName)) return;
  if (["chat", "news", "adm", "rep"].includes(TAB)) render();
}, 20000);

/* ===== البوانتاج (بلا GPS، الموظف يختار الوقت) ===== */
async function viewAtt() {
  const s = await db.collection("attendance").where("uid", "==", ME.uid).get();
  const recs = s.docs.map(d => d.data()).sort((a, b) => b.date.localeCompare(a.date)).slice(0, 40);
  const mk = todayIso().slice(0, 7);
  let tot = 0;
  recs.forEach(r => { if (r.date.startsWith(mk) && r.in && r.out) tot += mins(r.in, r.out); });
  const list = recs.map(r => `<div class="row2">
      <span>${r.date}</span><span>${r.in || "—"} → ${r.out || "—"}</span>
      <button class="small ghost2" onclick="editAtt('${r.date}','${r.in||""}','${r.out||""}')">تعديل</button>
    </div>`).join("");
  return `<div class="card center"><div class="big">${hm(tot)}</div><div class="sub">مجموع ساعات هذا الشهر</div></div>
    <div class="card"><h3>سجّل خدمتك</h3>
      <label>التاريخ</label><input type="date" id="ad" value="${todayIso()}">
      <label>الدخول</label><input type="time" id="ai">
      <label>الخروج</label><input type="time" id="ao">
      <button class="btn ok" onclick="saveAtt()">حفظ</button>
    </div>
    <div class="card"><h3>آخر الأيام</h3>${list || '<p class="sub">ما فماش حتى تسجيل</p>'}</div>`;
}

function editAtt(d, i, o) {
  $("#ad").value = d; $("#ai").value = i; $("#ao").value = o;
  window.scrollTo({top: 0, behavior: "smooth"});
}

async function saveAtt() {
  const d = $("#ad").value, i = $("#ai").value, o = $("#ao").value;
  if (!d || !i || !o) return toast("عمّر التاريخ والدخول والخروج");
  try {
    await db.collection("attendance").doc(ME.uid + "_" + d)
      .set({uid: ME.uid, date: d, in: i, out: o, updated: Date.now()});
    toast("تسجّل ✓"); render();
  } catch (e) { toast("ما تنجمش تسجّل، عاود"); }
}

/* ===== الأخبار (المنشورات تتبان بعد موافقة الأدمين) ===== */
async function viewNews() {
  const s = await db.collection("posts").orderBy("t", "desc").limit(60).get();
  const adm = isAdmin(ME);
  const posts = s.docs.map(d => ({id: d.id, ...d.data()}))
    .filter(p => p.status === "ok" || adm || p.uid === ME.uid);
  let h = `<div class="card"><textarea id="pt" placeholder="شنوة الجديد؟"></textarea>
    <input type="file" id="pf" accept="image/*">
    <button class="btn" onclick="addPost()">${adm ? "انشر" : "ابعث للأدمين"}</button>
    ${adm ? "" : '<div class="sub">المنشور يتبان بعد ما يوافق عليه الأدمين</div>'}</div>`;
  posts.forEach(p => {
    const liked = (p.likes || []).includes(ME.uid);
    const ok = p.status === "ok";
    h += `<div class="card">
      <div class="who">${avatar({name: p.name, photo: p.photo})}<div class="grow"><b>${esc(p.name)}</b>
        ${ok ? "" : ' <span class="chip">بانتظار الموافقة</span>'}<div class="sub">${fmt(p.t)}</div></div></div>
      ${p.text ? `<p>${esc(p.text)}</p>` : ""}
      ${p.img ? `<img class="pimg" src="${p.img}">` : ""}
      <div class="act">
        ${ok ? `<button class="small ${liked ? "" : "ghost2"}" onclick="likePost('${p.id}')">👍 ${(p.likes||[]).length}</button>` : ""}
        ${adm && !ok ? `<button class="small" onclick="approvePost('${p.id}')">موافقة</button>` : ""}
        ${(adm || p.uid === ME.uid) ? `<button class="small ghost2" onclick="delPost('${p.id}')">حذف</button>` : ""}
      </div>
      ${ok ? (p.comments || []).map(c => `<div class="cm"><b>${esc(c.name)}</b> ${esc(c.text)}</div>`).join("") +
        `<div class="row2"><input id="c_${p.id}" placeholder="كومنتير"><button class="small" onclick="comment('${p.id}')">ابعث</button></div>` : ""}
    </div>`;
  });
  return h || '<div class="card center sub">ما فماش حتى منشور</div>';
}

async function addPost() {
  const text = $("#pt").value.trim();
  const img = await shrink($("#pf").files[0], 800, 0.6);
  if (!text && !img) return toast("اكتب حاجة ولا زيد صورة");
  const adm = isAdmin(ME);
  try {
    await db.collection("posts").add({
      uid: ME.uid, name: P.name, photo: P.photo || "", text, img,
      status: adm ? "ok" : "pending", likes: [], comments: [], t: Date.now()
    });
    toast(adm ? "تنشر ✓" : "تبعث للأدمين ✓"); render();
  } catch (e) { toast("ما تنجمش تبعث، عاود"); }
}

async function approvePost(id) {
  await db.collection("posts").doc(id).update({status: "ok"}); render();
}

async function likePost(id) {
  const ref = db.collection("posts").doc(id);
  const p = (await ref.get()).data();
  const liked = (p.likes || []).includes(ME.uid);
  await ref.update({likes: liked ? FV.arrayRemove(ME.uid) : FV.arrayUnion(ME.uid)});
  render();
}

async function comment(id) {
  const text = $("#c_" + id).value.trim();
  if (!text) return;
  await db.collection("posts").doc(id).update({
    comments: FV.arrayUnion({uid: ME.uid, name: P.name, text, t: Date.now()})
  });
  render();
}

async function delPost(id) {
  if (!confirm("تفسخ المنشور؟")) return;
  await db.collection("posts").doc(id).delete(); render();
}

/* ===== المجموعة ===== */
async function viewChat() {
  const s = await db.collection("chat").orderBy("t", "asc").limit(200).get();
  const adm = isAdmin(ME);
  const bub = m => {
    const mine = m.uid === ME.uid;
    return `<div class="bub ${mine ? "me" : ""}">
      <div class="sub">${esc(m.name)}</div>
      <div>${esc(m.text)}${m.edited ? " <small>(معدّل)</small>" : ""}</div>
      ${(mine || adm) ? `<div class="act">
        ${mine ? `<span onclick="editMsg('${m.id}')">تعديل</span>` : ""}
        <span onclick="delMsg('${m.id}')">حذف</span></div>` : ""}
    </div>`;
  };
  const msgs = s.docs.map(d => ({id: d.id, ...d.data()}));
  return `<div class="card">
    <div class="notice">🤝 احترم زملاءك. ما تبدّلش ولا تمسحش رسائل غيرك، وخلّي الكلام محترم.</div>
    <div class="chat">${msgs.map(bub).join("") || '<p class="sub">ما فماش حتى رسالة</p>'}</div>
    <div class="row2"><input id="cm" placeholder="اكتب رسالة"><button class="small" onclick="sendChat()">ابعث</button></div>
  </div>`;
}

async function sendChat() {
  const text = $("#cm").value.trim();
  if (!text) return;
  await db.collection("chat").add({uid: ME.uid, name: P.name, text, t: Date.now()});
  render();
}

async function editMsg(id) {
  const ref = db.collection("chat").doc(id);
  const m = (await ref.get()).data();
  const v = prompt("عدّل الرسالة", m.text);
  if (v === null || !v.trim()) return;
  await ref.update({text: v.trim(), edited: true}); render();
}

async function delMsg(id) {
  if (!confirm("تفسخ هاذي الرسالة؟")) return;
  await db.collection("chat").doc(id).delete(); render();
}

/* ===== البروفيل ===== */
function viewProf() {
  const hasPw = ME.providerData.some(p => p.providerId === "password");
  return `<div class="card"><div class="who">${avatar(P, true)}<div class="grow"><b>${esc(P.name)}</b><div class="sub">${esc(ME.email)}</div></div></div>
      <label>صورة جديدة</label><input type="file" id="pp" accept="image/*">
      <button class="btn" onclick="savePhoto()">حفظ الصورة</button>
      <label>الاسم واللقب</label><input id="pn" value="${esc(P.name)}">
      <button class="btn ok" onclick="saveName()">حفظ الاسم</button>
    </div>
    <div class="card"><h3>شكاية للأدمين</h3>
      <textarea id="cp" placeholder="اكتب شكايتك، تتبعث للأدمين وحدو"></textarea>
      <button class="btn acc" onclick="sendComplaint()">ابعث للأدمين</button>
    </div>
    <div class="card"><h3>كلمة السر</h3>
      <input id="np" type="password" placeholder="كلمة السر الجديدة (6 أحرف على الأقل)">
      <button class="btn" onclick="setPw()">${hasPw ? "بدّل كلمة السر" : "ضيف كلمة سر"}</button>
    </div>
    <button class="btn gray" onclick="auth.signOut()">خروج</button>`;
}

async function savePhoto() {
  const f = $("#pp").files[0];
  if (!f) return toast("اختار صورة");
  const photo = await shrink(f, 200, 0.7);
  await db.collection("users").doc(ME.uid).update({photo});
  P.photo = photo; toast("تسجّل ✓"); render();
}

async function saveName() {
  const n = $("#pn").value.trim();
  if (!n) return toast("الاسم مطلوب");
  await db.collection("users").doc(ME.uid).update({name: n});
  P.name = n; toast("تسجّل ✓"); render();
}

async function sendComplaint() {
  const text = $("#cp").value.trim();
  if (!text) return toast("اكتب الشكاية");
  try {
    await db.collection("complaints").add({uid: ME.uid, name: P.name, text, t: Date.now()});
    toast("تبعثت للأدمين ✓"); $("#cp").value = "";
  } catch (e) { toast("ما تنجمش تبعث، عاود"); }
}

async function setPw() {
  const pw = $("#np").value;
  if (pw.length < 6) return toast("6 أحرف على الأقل");
  try {
    const has = ME.providerData.some(p => p.providerId === "password");
    if (has) await ME.updatePassword(pw);
    else await ME.linkWithCredential(firebase.auth.EmailAuthProvider.credential(ME.email, pw));
    toast("تبدّلت ✓"); $("#np").value = "";
  } catch (e) { toast("عاود تدخل وحاول من جديد"); }
}

/* ===== الأدمين: لوحة ===== */
async function viewAdm() {
  const users = (await db.collection("users").get()).docs.map(d => ({id: d.id, ...d.data()}));
  const att = (await db.collection("attendance").where("date", "==", todayIso()).get()).docs.map(d => d.data());
  const by = {}; att.forEach(a => by[a.uid] = a);
  const present = users.filter(u => by[u.id] && by[u.id].in).length;
  const rows = users.sort((a, b) => (a.name || "").localeCompare(b.name || "")).map(u => {
    const a = by[u.id], isA = ADMINS.includes((u.email || "").toLowerCase());
    return `<div class="row">${avatar(u)}<div class="grow"><b>${esc(u.name)}</b>
      <div class="sub">${a ? esc(a.in) + " → " + esc(a.out || "—") : "ما سجّلش اليوم"}${u.banned ? " · محظور" : ""}</div></div>
      ${isA ? "" : `<button class="small" style="background:${u.banned ? "#1f9d55" : "#d93a3a"}"
        onclick="toggleBan('${u.id}', ${!u.banned})">${u.banned ? "فك الحظر" : "حظر"}</button>`}
    </div>`;
  }).join("");
  return `<div class="card center"><div class="big">${present} / ${users.length}</div><div class="sub">حاضرين اليوم (${todayIso()})</div></div>
    <div class="card"><h3>الفريق</h3>${rows || '<p class="sub">ما فماش حتى عامل</p>'}</div>`;
}

async function toggleBan(id, v) {
  if (!confirm(v ? "تحظر هذا الحساب؟" : "تفك الحظر؟")) return;
  await db.collection("users").doc(id).update({banned: v}); render();
}

/* ===== الأدمين: الشكايات ===== */
async function viewRep() {
  const s = await db.collection("complaints").orderBy("t", "desc").get();
  const items = s.docs.map(d => {
    const c = d.data();
    return `<div class="ab"><b>${esc(c.name)}</b><div class="sub">${fmt(c.t)}</div>
      <p>${esc(c.text)}</p>
      <button class="small ghost2" onclick="delComplaint('${d.id}')">حذف</button></div>`;
  }).join("");
  return `<div class="card"><h3>الشكايات</h3>${items || '<p class="sub">ما فماش شكايات</p>'}</div>`;
}

async function delComplaint(id) {
  await db.collection("complaints").doc(id).delete(); render();
}
</script>
</body>
</html>
