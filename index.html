/* ===== إعدادات ===== */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyDTsYOpamWuywWpt2HBfwFYIwI3P3uIq8E",

// إيميل الأدمين (جيميل). تنجم تزيد أكثر من واحد.
const ADMINS = ["oussamabaccouch29@gmail.com"];

/* ===== أدوات ===== */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad = n => String(n).padStart(2, "0");
const todayIso = () => { const d = new Date(); return d.getFullYear() + "-" + pad(d.getMonth()+1) + "-" + pad(d.getDate()); };
const fmt = t => new Date(t).toLocaleString("fr-TN", {dateStyle:"short", timeStyle:"short"});
const toM = s => { const [h, m] = s.split(":").map(Number); return h*60 + m; };
const mins = (a, b) => { let x = toM(b) - toM(a); if (x < 0) x += 1440; return x; };
const hm = m => pad(Math.floor(m/60)) + "h" + pad(m % 60);
const isAdmin = u => !!u && ADMINS.includes((u.email || "").toLowerCase());
const avatar = (a, big) => a && a.photo

function toast(m) {
  const t = $("#toast");
  t.textContent = m; t.style.display = "block";
  clearTimeout(toast.t);
  toast.t = setTimeout(() => t.style.display = "none", 2600);
}

function shrink(file, max = 300, q = 0.7) {
  return new Promise(res => {
    if (!file) return res("");
    const r = new FileReader();
    r.onload = () => {
      const im = new Image();
      im.onload = () => {
        const k = Math.min(1, max / Math.max(im.width, im.height));
        const c = document.createElement("canvas");
        c.width = im.width * k; c.height = im.height * k;
        c.getContext("2d").drawImage(im, 0, 0, c.width, c.height);
        res(c.toDataURL("image/jpeg", q));
      };
      im.src = r.result;
    };
    r.readAsDataURL(file);
  });
}

/* ===== الدخول ===== */
let ME = null, P = null, TAB = "att", SIGNING = false;

const FAKE = "@pointage.local";
const slug = n => [...n.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().replace(/\s+/g, "")]
  .map(c => /[a-z0-9._-]/.test(c) ? c : "u" + c.codePointAt(0).toString(16)).join("");
const nameEmail = n => slug(n) + FAKE;
const toEmail = s => { s = s.trim(); return s.includes("@") ? s.toLowerCase() : nameEmail(s); };
const isFake = e => (e || "").endsWith(FAKE);
const lmsg = t => { const a = $("#lmsg"); if (a) a.textContent = t; toast(t); };

auth.onAuthStateChanged(async u => {
  ME = u;
  if (!u) { P = null; return renderLogin(); }
  if (SIGNING) return;
  try {
    if (u.providerData.some(p => p.providerId === "google.com") && !isAdmin(u)) {
      await auth.signOut();
      return toast("Gmail للأدمين برك. العملة يعملو حساب بالاسم وكلمة السر");
    }
    let s = await db.collection("users").doc(u.uid).get();
    if (!s.exists && isAdmin(u)) {
      await db.collection("users").doc(u.uid).set({name: "Admin", email: (u.email || "").toLowerCase(), photo: "", banned: false, createdAt: Date.now()});
      s = await db.collection("users").doc(u.uid).get();
    }
    P = s.exists ? s.data() : null;
    if (!P) { toast("الحساب موش مكتمل، اعمل حساب من جديد"); return auth.signOut(); }
    if (P.banned) { toast("تم حظر حسابك من الأدمين"); return auth.signOut(); }
    TAB = isAdmin(u) ? "adm" : "att";
    render();
  } catch (e) {
    console.error(e);
    toast("خطأ: " + (e.code || e.message));
    auth.signOut();
  }
});

async function gLogin() {
  const pr = new firebase.auth.GoogleAuthProvider();
  pr.setCustomParameters({prompt: "select_account"});
  try {
    await auth.signInWithPopup(pr);
  } catch (e) {
    console.error(e);
    if (e.code === "auth/popup-blocked") return auth.signInWithRedirect(pr).catch(x => toast("خطأ: " + x.code));
    if (e.code === "auth/popup-closed-by-user" || e.code === "auth/cancelled-popup-request") return;
    toast(({
      "auth/unauthorized-domain": "الدومين موش مسموح: زيدو في Authentication ← Paramètres ← Domaines autorisés",
      "auth/operation-not-allowed": "فعّل Google في Firebase ← Authentication",
      "auth/network-request-failed": "مشكل في الإنترنت، عاود"
    })[e.code] || ("ما تنجمش تدخل بالجيميل: " + e.code));
  }
}

async function pLogin() {
  const id = $("#le").value.trim(), pw = $("#lp").value;
  if (!id || !pw) return toast("اكتب الاسم وكلمة السر");
  try {
    await auth.signInWithEmailAndPassword(toEmail(id), pw);
  } catch (e) {
    console.error(e);
    toast(e.code === "auth/network-request-failed" ? "مشكل في الإنترنت" : "الاسم ولا كلمة السر غالطين");
  }
}

async function pSignup() {
  const n = $("#rn").value.trim().replace(/\s+/g, " ").replace(/@/g, ""), pw = $("#rp").value, pw2 = $("#rp2").value;
  if (n.length < 3) return toast("اكتب الاسم واللقب");
  if (slug(n) === "admin") return toast("هذا الاسم ممنوع");
  if (pw.length < 6) return toast("كلمة السر 6 أحرف على الأقل");
  if (pw !== pw2) return toast("كلمتين السر موش متشابهين");
  SIGNING = true;
  let c;
  try {
    c = await auth.createUserWithEmailAndPassword(nameEmail(n), pw);
  } catch (e) {
    SIGNING = false;
    console.error(e);
    return toast(({
      "auth/email-already-in-use": "الاسم موجود، زيد رقم ولا حرف (مثال: Ali Ben 2)",
      "auth/operation-not-allowed": "فعّل Email/Password في Firebase",
      "auth/network-request-failed": "مشكل في الإنترنت، عاود"
    })[e.code] || ("ما تنجمش تسجّل: " + (e.code || e.message)));
  }
  try {
    const doc = {name: n, email: nameEmail(n), photo: "", banned: false, createdAt: Date.now()};
    await db.collection("users").doc(c.user.uid).set(doc);
    ME = c.user; P = doc; TAB = "att"; SIGNING = false;
    render();
  } catch (e) {
    SIGNING = false;
    console.error(e);
    toast("الحساب تعمل، أما الحفظ فشل (قواعد Firestore): " + (e.code || e.message));
    auth.signOut();
  }
}

function showBox(w) {
  $("#boxLogin").style.display = w === "login" ? "" : "none";
  $("#boxReg").style.display = w === "reg" ? "" : "none";
}

function renderLogin() {
  $app.innerHTML = `<div class="wrap">

    <div class="card">

      <div id="boxLogin">
        <label>الاسم واللقب</label><input id="le" autocapitalize="off" autocomplete="username">
        <label>كلمة السر</label><input id="lp" type="password" autocomplete="current-password" onkeydown="if(event.key==='Enter')pLogin()">
        <button class="btn" onclick="pLogin()">دخول</button>

    <div class="credit">تطبيق شخصي من إنشاء <b>Oussama Baccouch</b>، ما عندو حتى علاقة بنظام شركة LEONI.</div>

/* ===== الواجهة ===== */
function getTabs() {
  return isAdmin(ME)
    ? [["adm","لوحة","🏠"],["news","أخبار","📰"],["chat","مجموعة","💬"],["rep","شكايات","📩"],["prof","بروفيل","👤"]]

function go(k) { TAB = k; render(); }

async function render() {
  if (!ME || !P) return;
  const tabs = getTabs();
  if (!tabs.some(x => x[0] === TAB)) TAB = tabs[0][0];
  const fn = {att: viewAtt, news: viewNews, chat: viewChat, prof: viewProf, adm: viewAdm, rep: viewRep}[TAB];
  let body;
  try { body = await fn(); } catch (e) { body = `<div class="card">خطأ: ${esc(e.message)}</div>`; }

// تحديث تلقائي للمجموعة والأخبار، من غير ما نمسحو الكتابة
setInterval(() => {

  if (["chat", "news", "adm", "rep"].includes(TAB)) render();
}, 20000);

/* ===== الورديات والأجر ===== */
const DEF_SHIFTS = [
  {name: "صباح", in: "06:00", out: "14:00"},
  {name: "عشية", in: "14:00", out: "22:00"},
  {name: "ليل", in: "22:00", out: "06:00"}
];
let SHIFTS = DEF_SHIFTS, PER_OFF = 0, LAST = {recs: [], per: null};
// ضرب الأجر: الأحد 1.27، السبت 1.25، باقي الأيام 1
const WMULT = {0: 1.27, 6: 1.25};
const multOf = iso => WMULT[new Date(iso + "T12:00:00").getDay()] || 1;
const nowHM = () => { const d = new Date(); return pad(d.getHours()) + ":" + pad(d.getMinutes()); };
const dec = m => (m / 60).toFixed(2);
const isoOf = d => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());

async function loadShifts() {
  try {
    const s = await db.collection("settings").doc("shifts").get();
    if (s.exists && s.data().list && s.data().list.length === 3) SHIFTS = s.data().list;
  } catch (e) { console.error(e); }
}

// الشهر الخدمة: من 27 لين 26
function periodOf(off) {
  const t = new Date();
  const sm = (t.getDate() >= 27 ? t.getMonth() : t.getMonth() - 1) + off;
  const ds = new Date(t.getFullYear(), sm, 27), de = new Date(t.getFullYear(), sm + 1, 26);
  return {s: isoOf(ds), e: isoOf(de), ds, de};
}
const perLabel = p => p.ds.getDate() + "/" + (p.ds.getMonth() + 1) + " ← " + p.de.getDate() + "/" + (p.de.getMonth() + 1) + "/" + p.de.getFullYear();
function movePer(n) { PER_OFF += n; render(); }

function payCalc(recs, rate) {
  const o = {hN: 0, hSa: 0, hSu: 0, days: 0};
  recs.forEach(r => {
    if (!(r.in && r.out)) return;
    const h = mins(r.in, r.out) / 60, g = new Date(r.date + "T12:00:00").getDay();
    o.days++;
    if (g === 0) o.hSu += h; else if (g === 6) o.hSa += h; else o.hN += h;
  });
  o.H = o.hN + o.hSa + o.hSu;
  o.gN = o.hN * rate; o.gSa = o.hSa * rate * WMULT[6]; o.gSu = o.hSu * rate * WMULT[0];
  o.brut = o.gN + o.gSa + o.gSu;
  o.net = o.brut;
  return o;
}

/* ===== البوانتاج ===== */
async function viewAtt() {
  await loadShifts();
  const per = periodOf(PER_OFF);
  const s = await db.collection("attendance").where("uid", "==", ME.uid).get();
  const all = s.docs.map(d => d.data());
  const byDate = {}; all.forEach(r => byDate[r.date] = r);
  const recs = all.filter(r => r.date >= per.s && r.date <= per.e && r.in && r.out);
  LAST = {recs, per};
  let tot = 0; recs.forEach(r => tot += mins(r.in, r.out));
  const today = todayIso(), yest = isoOf(new Date(Date.now() - 864e5));
  const tr = byDate[today], yr = byDate[yest];
  const open = tr && tr.in && !tr.out ? tr : (yr && yr.in && !yr.out ? yr : null);
  const shown = open || tr;
  const sh = SHIFTS.find(x => x.name === P.shift) || SHIFTS[0];

  const lead = (per.ds.getDay() + 6) % 7;
  let cells = "<i></i>".repeat(lead);
  for (let d = new Date(per.ds); d <= per.de; d.setDate(d.getDate() + 1)) {
    const iso = isoOf(d), r = byDate[iso], w = r && r.in && r.out;
    cells += `<div class="cal ${w ? "w" : ""} ${iso === today ? "td" : ""}" onclick="editAtt('${iso}','${r ? r.in || "" : ""}','${r ? r.out || "" : ""}')">
      <b>${d.getDate()}</b><small>${w ? dec(mins(r.in, r.out)) + "h" : (r && r.in ? "…" : "")}</small></div>`;
  }
  const opts = SHIFTS.map(x => `<option value="${esc(x.name)}" ${x.name === sh.name ? "selected" : ""}>${esc(x.name)} (${x.in} → ${x.out})</option>`).join("");

  return `<div class="card"><div class="sub">${open && open.date !== today ? "وردية ليلية بدات البارح" : "اليوم"}</div>
      <div class="big" style="direction:ltr;text-align:center">${shown && shown.in ? shown.in : "--:--"} → ${shown && shown.out ? shown.out : "--:--"}</div>
      <label>الوردية</label><select id="shs" onchange="setShift(this.value)">${opts}</select>
      <div class="act"><button class="btn ok" style="flex:1" onclick="punchIn()">دخول</button>
      <button class="btn ko" style="flex:1" onclick="punchOut()">خروج</button></div></div>
    <div class="card">
      <div class="row2" style="border:0"><button class="small ghost2" onclick="movePer(-1)">›</button>
        <span class="center"><b>${perLabel(per)}</b></span><button class="small ghost2" onclick="movePer(1)">‹</button></div>
      <div class="row2" style="border:0;justify-content:space-around">
        <div class="center"><div class="big">${dec(tot)}</div><div class="sub">ساعات</div></div>
        <div class="center"><div class="big">${recs.length}</div><div class="sub">أيام خدمة</div></div></div>
      <div class="calgrid" style="direction:ltr">${["L","M","M","J","V","S","D"].map(x => `<em>${x}</em>`).join("")}${cells}</div>
    </div>
    <div class="card"><h3>تعديل / إضافة يوم</h3>
      <label>التاريخ</label><input type="date" id="ad" value="${todayIso()}">
      <label>الدخول</label><input type="time" id="ai" value="${sh.in}">
      <label>الخروج</label><input type="time" id="ao" value="${sh.out}">
      <button class="btn ok" onclick="saveAtt()">حفظ</button></div>
    <div class="card"><h3>الأجر والفيش</h3>
      <label>سعر الساعة (DT)</label><input id="pr" type="number" step="0.001" inputmode="decimal" value="${P.rate || ""}">
      <label>المطرية (Matricule) - اختياري</label><input id="pm" value="${esc(P.mat || "")}">
      <label>CIN - اختياري</label><input id="pc" value="${esc(P.cin || "")}">
      <button class="btn" onclick="savePay()">حفظ</button>
      <button class="btn acc" onclick="showSlip()">🧾 فيش الخلاص (تقريبي)</button></div>`;
}

async function setShift(v) {
  try { await db.collection("users").doc(ME.uid).update({shift: v}); P.shift = v; render(); }
  catch (e) { console.error(e); toast("ما تنجمش تبدّل الوردية"); }
}

async function punchIn() {
  const d = todayIso(), ref = db.collection("attendance").doc(ME.uid + "_" + d);
  try {
    const ex = await ref.get();
    if (ex.exists && ex.data().in) return toast("دخلت اليوم قبل: " + ex.data().in);
    await ref.set({uid: ME.uid, date: d, in: nowHM(), out: "", shift: P.shift || SHIFTS[0].name, updated: Date.now()});
    toast("تسجّل الدخول ✓"); render();
  } catch (e) { console.error(e); toast("ما تنجمش تسجّل: " + (e.code || e.message)); }
}

async function punchOut() {
  try {
    const t = todayIso(), y = isoOf(new Date(Date.now() - 864e5));
    for (const d of [t, y]) {
      const ref = db.collection("attendance").doc(ME.uid + "_" + d), s = await ref.get();
      if (s.exists && s.data().in && !s.data().out) {
        await ref.update({out: nowHM(), updated: Date.now()});
        toast("تسجّل الخروج ✓"); return render();
      }
    }
    toast("ما فماش دخول مفتوح");
  } catch (e) { console.error(e); toast("ما تنجمش تسجّل: " + (e.code || e.message)); }
}

function editAtt(d, i, o) {
  $("#ad").value = d; $("#ai").value = i; $("#ao").value = o;
  $("#ad").scrollIntoView({behavior: "smooth", block: "center"});
}

async function saveAtt() {
  const d = $("#ad").value, i = $("#ai").value, o = $("#ao").value;
  if (!d || !i || !o) return toast("عمّر التاريخ والدخول والخروج");
  try {
    await db.collection("attendance").doc(ME.uid + "_" + d)
      .set({uid: ME.uid, date: d, in: i, out: o, shift: P.shift || SHIFTS[0].name, updated: Date.now()});
    toast("تسجّل ✓"); render();
  } catch (e) { toast("ما تنجمش تسجّل، عاود"); }
}

async function savePay() {
  const rate = parseFloat($("#pr").value);
  if (!(rate > 0)) return toast("اكتب سعر الساعة");
  const d = {rate, mat: $("#pm").value.trim(), cin: $("#pc").value.trim()};
  try { await db.collection("users").doc(ME.uid).update(d); Object.assign(P, d); toast("تسجّل ✓"); render(); }
  catch (e) { console.error(e); toast("ما تنجمش تسجّل: " + (e.code || e.message)); }
}

function showSlip() {
  const rate = +P.rate || 0;
  if (!rate) return toast("حدّد سعر الساعة وسجّلو أول");
  const c = payCalc(LAST.recs, rate), per = LAST.per;
  const f = n => n.toFixed(3).replace(".", ","), h = n => n.toFixed(2).replace(".", ",");
  const month = per.de.toLocaleDateString("fr-FR", {month: "long", year: "numeric"});
  const row = (l, b, t, g, r) => `<tr><td>${l}</td><td>${b}</td><td>${t}</td><td>${g}</td><td>${r}</td></tr>`;
  const el = document.createElement("div");
  el.id = "slip";
  el.innerHTML = `<div class="slipbox" style="direction:ltr;text-align:left">
    <div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap">
      <div><b>${esc(P.name)}</b><br>${month} · Provisoire</div>
      <div style="font-size:12px">Matricule: ${esc(P.mat || "—")}<br>CIN: ${esc(P.cin || "—")}</div></div>
    <h3 style="margin:14px 0 4px">BULLETIN de PAIE</h3>
    <div style="font-size:13px">Période: du ${per.ds.toLocaleDateString("fr-FR")} au ${per.de.toLocaleDateString("fr-FR")} · Jours travaillés: ${c.days}</div>
    <div style="overflow-x:auto"><table class="slipt"><tr><th>Libellé</th><th>Base</th><th>Taux</th><th>Gains</th><th></th></tr>
      ${row("Heures normales (L→V)", h(c.hN), f(rate), f(c.gN), "")}
      ${c.hSa ? row("Samedi ×" + WMULT[6], h(c.hSa), f(rate * WMULT[6]), f(c.gSa), "") : ""}
      ${c.hSu ? row("Dimanche ×" + WMULT[0], h(c.hSu), f(rate * WMULT[0]), f(c.gSu), "") : ""}
      ${row("<b>Salaire brut</b>", "", "", "<b>" + f(c.brut) + "</b>", "")}
      </table></div>
    <div class="slipnet"><span>Total à payer</span><b>${f(c.net)} DT</b></div>
    <p style="font-size:12px;color:#556">Estimation brute (sans retenues CNSS / IRPP). Document personnel non officiel.</p>
    <div class="noprint" style="display:flex;gap:8px"><button class="btn" onclick="window.print()">Imprimer</button>
      <button class="btn gray" onclick="document.getElementById('slip').remove()">Fermer</button></div></div>`;
  document.body.appendChild(el);
}

/* ===== الأخبار (المنشورات تتبان بعد موافقة الأدمين) ===== */
async function viewNews() {
  const s = await db.collection("posts").orderBy("t", "desc").limit(60).get();
  const adm = isAdmin(ME);
  const posts = s.docs.map(d => ({id: d.id, ...d.data()}))
    .filter(p => p.status === "ok" || adm || p.uid === ME.uid);
  let h = `<div class="card"><textarea id="pt" placeholder="شنوة الجديد؟"></textarea>
    <input type="file" id="pf" accept="image/*">
    <button class="btn" onclick="addPost()">${adm ? "انشر" : "ابعث للأدمين"}</button>
    ${adm ? "" : '<div class="sub">المنشور يتبان بعد ما يوافق عليه الأدمين</div>'}</div>`;
  posts.forEach(p => {
    const liked = (p.likes || []).includes(ME.uid);
    const ok = p.status === "ok";
    h += `<div class="card">
      <div class="who">${avatar({name: p.name, photo: p.photo})}<div class="grow"><b>${esc(p.name)}</b>
        ${ok ? "" : ' <span class="chip">بانتظار الموافقة</span>'}<div class="sub">${fmt(p.t)}</div></div></div>
      ${p.text ? `<p>${esc(p.text)}</p>` : ""}
      ${p.img ? `<img class="pimg" src="${p.img}">` : ""}
      <div class="act">
        ${ok ? `<button class="small ${liked ? "" : "ghost2"}" onclick="likePost('${p.id}')">👍 ${(p.likes||[]).length}</button>` : ""}
        ${adm && !ok ? `<button class="small" onclick="approvePost('${p.id}')">موافقة</button>` : ""}
        ${(adm || p.uid === ME.uid) ? `<button class="small ghost2" onclick="delPost('${p.id}')">حذف</button>` : ""}
      </div>
      ${ok ? (p.comments || []).map(c => `<div class="cm"><b>${esc(c.name)}</b> ${esc(c.text)}</div>`).join("") +
        `<div class="row2"><input id="c_${p.id}" placeholder="كومنتير"><button class="small" onclick="comment('${p.id}')">ابعث</button></div>` : ""}
    </div>`;
  });
  return h || '<div class="card center sub">ما فماش حتى منشور</div>';
}

async function addPost() {
  const text = $("#pt").value.trim();
  const img = await shrink($("#pf").files[0], 800, 0.6);
  if (!text && !img) return toast("اكتب حاجة ولا زيد صورة");
  const adm = isAdmin(ME);
  try {
    await db.collection("posts").add({
      uid: ME.uid, name: P.name, photo: P.photo || "", text, img,
      status: adm ? "ok" : "pending", likes: [], comments: [], t: Date.now()
    });
    toast(adm ? "تنشر ✓" : "تبعث للأدمين ✓"); render();
  } catch (e) { toast("ما تنجمش تبعث، عاود"); }
}

async function approvePost(id) {
  await db.collection("posts").doc(id).update({status: "ok"}); render();
}

async function likePost(id) {
  const ref = db.collection("posts").doc(id);
  const p = (await ref.get()).data();
  const liked = (p.likes || []).includes(ME.uid);
  await ref.update({likes: liked ? FV.arrayRemove(ME.uid) : FV.arrayUnion(ME.uid)});
  render();
}

async function comment(id) {
  const text = $("#c_" + id).value.trim();
  if (!text) return;
  await db.collection("posts").doc(id).update({
    comments: FV.arrayUnion({uid: ME.uid, name: P.name, text, t: Date.now()})
  });
  render();
}

async function delPost(id) {
  if (!confirm("تفسخ المنشور؟")) return;
  await db.collection("posts").doc(id).delete(); render();
}

/* ===== المجموعة ===== */
async function viewChat() {
  const s = await db.collection("chat").orderBy("t", "asc").limit(200).get();
  const adm = isAdmin(ME);
  const bub = m => {
    const mine = m.uid === ME.uid;
    return `<div class="bub ${mine ? "me" : ""}">
      <div class="sub">${esc(m.name)}</div>
      <div>${esc(m.text)}${m.edited ? " <small>(معدّل)</small>" : ""}</div>
      ${(mine || adm) ? `<div class="act">
        ${mine ? `<span onclick="editMsg('${m.id}')">تعديل</span>` : ""}
        <span onclick="delMsg('${m.id}')">حذف</span></div>` : ""}
    </div>`;
  };
  const msgs = s.docs.map(d => ({id: d.id, ...d.data()}));
  return `<div class="card">
    <div class="notice">🤝 احترم زملاءك. ما تبدّلش ولا تمسحش رسائل غيرك، وخلّي الكلام محترم.</div>
    <div class="chat">${msgs.map(bub).join("") || '<p class="sub">ما فماش حتى رسالة</p>'}</div>
    <div class="row2"><input id="cm" placeholder="اكتب رسالة"><button class="small" onclick="sendChat()">ابعث</button></div>
  </div>`;
}

async function sendChat() {
  const text = $("#cm").value.trim();
  if (!text) return;
  await db.collection("chat").add({uid: ME.uid, name: P.name, text, t: Date.now()});
  render();
}

async function editMsg(id) {
  const ref = db.collection("chat").doc(id);
  const m = (await ref.get()).data();
  const v = prompt("عدّل الرسالة", m.text);
  if (v === null || !v.trim()) return;
  await ref.update({text: v.trim(), edited: true}); render();
}

async function delMsg(id) {
  if (!confirm("تفسخ هاذي الرسالة؟")) return;
  await db.collection("chat").doc(id).delete(); render();
}

/* ===== البروفيل ===== */
function viewProf() {
  const hasPw = ME.providerData.some(p => p.providerId === "password");
  return `<div class="card"><div class="who">${avatar(P, true)}<div class="grow"><b>${esc(P.name)}</b><div class="sub">${isFake(ME.email) ? "حساب بالاسم وكلمة السر" : esc(ME.email)}</div></div></div>
      <label>صورة جديدة</label><input type="file" id="pp" accept="image/*">
      <button class="btn" onclick="savePhoto()">حفظ الصورة</button>
      <label>الاسم واللقب</label><input id="pn" value="${esc(P.name)}">
      <button class="btn ok" onclick="saveName()">حفظ الاسم</button>
    </div>
    <div class="card"><h3>شكاية للأدمين</h3>
      <textarea id="cp" placeholder="اكتب شكايتك، تتبعث للأدمين وحدو"></textarea>
      <button class="btn acc" onclick="sendComplaint()">ابعث للأدمين</button>
    </div>
    <div class="card"><h3>كلمة السر</h3>
      <input id="np" type="password" placeholder="كلمة السر الجديدة (6 أحرف على الأقل)">
      <button class="btn" onclick="setPw()">${hasPw ? "بدّل كلمة السر" : "ضيف كلمة سر"}</button>
    </div>
    <button class="btn gray" onclick="auth.signOut()">خروج</button>`;
}

async function savePhoto() {
  const f = $("#pp").files[0];
  if (!f) return toast("اختار صورة");
  const photo = await shrink(f, 200, 0.7);
  await db.collection("users").doc(ME.uid).update({photo});
  P.photo = photo; toast("تسجّل ✓"); render();
}

async function saveName() {
  const n = $("#pn").value.trim();
  if (!n) return toast("الاسم مطلوب");
  await db.collection("users").doc(ME.uid).update({name: n});
  P.name = n; toast("تسجّل ✓"); render();
}

async function sendComplaint() {
  const text = $("#cp").value.trim();
  if (!text) return toast("اكتب الشكاية");
  try {
    await db.collection("complaints").add({uid: ME.uid, name: P.name, text, t: Date.now()});
    toast("تبعثت للأدمين ✓"); $("#cp").value = "";
  } catch (e) { toast("ما تنجمش تبعث، عاود"); }
}

async function setPw() {
  const pw = $("#np").value;
  if (pw.length < 6) return toast("6 أحرف على الأقل");
  try {
    const has = ME.providerData.some(p => p.providerId === "password");
    if (has) await ME.updatePassword(pw);
    else await ME.linkWithCredential(firebase.auth.EmailAuthProvider.credential(ME.email, pw));
    toast("تبدّلت ✓"); $("#np").value = "";
  } catch (e) { toast("عاود تدخل وحاول من جديد"); }
}

/* ===== الأدمين: لوحة ===== */
async function viewAdm() {
  await loadShifts();
  const per = periodOf(PER_OFF);
  const users = (await db.collection("users").get()).docs.map(d => ({id: d.id, ...d.data()}));
  const pAtt = (await db.collection("attendance").where("date", ">=", per.s).where("date", "<=", per.e).get()).docs.map(d => d.data());
  const att = pAtt.filter(a => a.date === todayIso());
  const by = {}; att.forEach(a => by[a.uid] = a);
  const present = users.filter(u => by[u.id] && by[u.id].in).length;
  const rows = users.sort((a, b) => (a.name || "").localeCompare(b.name || "")).map(u => {
    const a = by[u.id], isA = ADMINS.includes((u.email || "").toLowerCase());
    const mine = pAtt.filter(x => x.uid === u.id && x.in && x.out);
    let mm = 0; mine.forEach(x => mm += mins(x.in, x.out));
    const pay = u.rate ? payCalc(mine, +u.rate) : null;
    return `<div class="row">${avatar(u)}<div class="grow"><b>${esc(u.name)}</b>
      <div class="sub">${a ? esc(a.in) + " → " + esc(a.out || "—") : "ما سجّلش اليوم"}${u.banned ? " · محظور" : ""}</div>
      ${isA ? "" : `<div class="sub">${dec(mm)}h · ${mine.length} يوم · ${pay ? "المجموع ≈ " + pay.net.toFixed(3) + " DT" : "ما حدّدش سعر الساعة"}</div>`}</div>
      ${isA ? "" : `<button class="small" style="background:${u.banned ? "#1f9d55" : "#d93a3a"}"
        onclick="toggleBan('${u.id}', ${!u.banned})">${u.banned ? "فك الحظر" : "حظر"}</button>`}
    </div>`;
  }).join("");
  const sh = SHIFTS.map((x, i) => `<div class="row2"><span>${esc(x.name)}</span>
      <input type="time" id="si${i}" value="${x.in}"><input type="time" id="so${i}" value="${x.out}"></div>`).join("");
  return `<div class="card center"><div class="big">${present} / ${users.length}</div><div class="sub">حاضرين اليوم (${todayIso()})</div></div>
    <div class="card"><h3>الورديات (الدخول والخروج)</h3>${sh}<button class="btn ok" onclick="saveShifts()">حفظ الورديات</button></div>
    <div class="card"><div class="row2" style="border:0"><button class="small ghost2" onclick="movePer(-1)">›</button>
      <span class="center"><b>${perLabel(per)}</b></span><button class="small ghost2" onclick="movePer(1)">‹</button></div>
      <h3>الفريق</h3>${rows || '<p class="sub">ما فماش حتى عامل</p>'}</div>`;
}

async function saveShifts() {
  const list = SHIFTS.map((x, i) => ({name: x.name, in: $("#si" + i).value, out: $("#so" + i).value}));
  if (list.some(x => !x.in || !x.out)) return toast("عمّر كل الأوقات");
  try { await db.collection("settings").doc("shifts").set({list}); SHIFTS = list; toast("تسجّل ✓"); render(); }
  catch (e) { console.error(e); toast("ما تنجمش تسجّل: " + (e.code || e.message)); }
}

async function toggleBan(id, v) {
  if (!confirm(v ? "تحظر هذا الحساب؟" : "تفك الحظر؟")) return;
  await db.collection("users").doc(id).update({banned: v}); render();
}

/* ===== الأدمين: الشكايات ===== */
async function viewRep() {
  const s = await db.collection("complaints").orderBy("t", "desc").get();
  const items = s.docs.map(d => {
    const c = d.data();
    return `<div class="ab"><b>${esc(c.name)}</b><div class="sub">${fmt(c.t)}</div>
      <p>${esc(c.text)}</p>
      <button class="small ghost2" onclick="delComplaint('${d.id}')">حذف</button></div>`;
  }).join("");
  return `<div class="card"><h3>الشكايات</h3>${items || '<p class="sub">ما فماش شكايات</p>'}</div>`;
}

async function delComplaint(id) {
  await db.collection("complaints").doc(id).delete(); render();
}
</script>
</body>
</html>
