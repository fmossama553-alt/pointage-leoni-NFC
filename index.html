var lang=localStorage.getItem("pt_lang")||"ar",cfg={};

function t(k){return(L[lang]&&L[lang][k])||L.fr[k]||k}

function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function pad(n){return String(n).padStart(2,"0")}
function iso(y,m,d){return y+"-"+pad(m)+"-"+pad(d)}
function dIso(d){return iso(d.getFullYear(),d.getMonth()+1,d.getDate())}
function todayIso(){return dIso(new Date())}
function nowHM(){var d=new Date();return pad(d.getHours())+":"+pad(d.getMinutes())}
function f2(x){return(Math.round(x*100)/100).toFixed(2)}
function toast(ok,msg){var el=document.getElementById("toast");el.className="toast "+(ok?"ok":"ko");el.textContent=msg;el.style.display="block";clearTimeout(toast.t);toast.t=setTimeout(function(){el.style.display="none"},3500)}
function fail(e){var m=String(e&&e.message||e);
 if(m==="login")toast(false,t("err_login"));else if(m==="cfg")toast(false,t("cfg"));
 else if(/Failed to fetch|NetworkError|Load failed/i.test(m))toast(false,t("err_net"));else toast(false,t("err_srv")+" "+m)}
/* Firebase REST */
async function tok(){
 if(S.token&&Date.now()-S.at<3000000)return S.token;
 if(!cfg.key)throw new Error("cfg");

 var rt=localStorage.getItem("pt_rt");
 if(rt){var q=await fetch("https://securetoken.googleapis.com/v1/token?key="+encodeURIComponent(cfg.key),{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},body:"grant_type=refresh_token&refresh_token="+encodeURIComponent(rt)});if(q.ok){var qj=await q.json();S.token=qj.id_token;S.at=Date.now();localStorage.setItem("pt_rt",qj.refresh_token);return S.token}}
 if(!S.pw)throw new Error("login");
 var r=await fetch("https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key="+encodeURIComponent(cfg.key),{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email:S.email,password:S.pw,returnSecureToken:true})});
 if(!r.ok)throw new Error("login");var j=await r.json();S.token=j.idToken;S.at=Date.now();localStorage.setItem("pt_rt",j.refreshToken);return S.token}
function base(){return"https://firestore.googleapis.com/v1/projects/"+encodeURIComponent(cfg.pid)+"/databases/(default)/documents"}
async function api(method,url,body){
 var r=await fetch(url,{method:method,headers:{"Content-Type":"application/json","Authorization":"Bearer "+await tok()},body:body?JSON.stringify(body):undefined});
 if(r.status===404)return null;if(!r.ok)throw new Error("HTTP "+r.status);return r.json()}
function enc(o){var f={};Object.keys(o).forEach(function(k){f[k]={stringValue:String(o[k])}});return{fields:f}}
function dec(d){var o={},f=d.fields||{};Object.keys(f).forEach(function(k){o[k]=f[k].stringValue||""});o.id=d.name.split("/").pop();return o}
async function listDocs(col){var out=[],pt="";do{var j=await api("GET",base()+"/"+col+"?pageSize=300"+(pt?"&pageToken="+encodeURIComponent(pt):""));((j&&j.documents)||[]).forEach(function(d){out.push(dec(d))});pt=(j&&j.nextPageToken)||""}while(pt);return out}

function setDoc(path,o){var m=Object.keys(o).map(function(k){return"updateMask.fieldPaths="+encodeURIComponent(k)}).join("&");return api("PATCH",base()+"/"+path+"?"+m,enc(o))}

/* calcul */
function toMin(s){var p=String(s).split(":");return(+p[0])*60+(+p[1])}
function mins(a,b){var x=toMin(b)-toMin(a);if(x<0)x+=1440;return x}
function earn(ds,tin,tout,rate){var p=ds.split("-").map(Number),dow=new Date(p[0],p[1]-1,p[2]).getDay(),b=dow===6?1.25:(dow===0?1.75:1),tot=mins(tin,tout),s=toMin(tin),sum=0;
 for(var i=0;i<tot;i++){var md=(s+i)%1440,m=b;if(i>=480)m=Math.max(m,1.25);if(md>=1020)m=Math.max(m,1.25);sum+=m/60}return sum*rate}
/* paie tunisienne : barème IRPP LF 2025 (annuel), CNSS 9,68 %, CSS 0,5 %, frais pro 10 % plafonnés à 2000, chef de famille 300, enfant 100 (max 4) */
var CNSS=.0968,CSSR=.005,BAR=[[5000,0],[10000,.15],[20000,.25],[30000,.30],[40000,.33],[50000,.36],[70000,.38],[1e12,.40]];
function irpp(b){var s=0,p=0;BAR.forEach(function(x){if(b>p)s+=(Math.min(b,x[0])-p)*x[1];p=x[0]});return s}
function pay(brut,w){var cn=brut*CNSS,a=(brut-cn)*12,fp=Math.min(a*.1,2000),fam=(w.chef==="1"?300:0)+Math.min(+w.enf||0,4)*100,bs=Math.max(0,a-fp-fam),ir=irpp(bs)/12,cs=bs*CSSR/12;return{brut:brut,cn:cn,ir:ir,cs:cs,net:brut-cn-ir-cs}}
/* periode 27 -> 26 */
function perRange(y,m){return[new Date(y,m-2,27),new Date(y,m-1,26)]}
function curPer(){var d=new Date(),m=d.getMonth()+1,y=d.getFullYear();if(d.getDate()>=27){m++;if(m>12){m=1;y++}}V.y=y;V.m=m}
/* vues */
function setLang(v){lang=v;localStorage.setItem("pt_lang",v);render()}
function topBar(o){return'<div class="top"><div class="brand"><span class="logo">⏱</span><span>Pointage<small>Team</small></span></div><select class="lang" onchange="setLang(this.value)">'+['ar','fr'].map(function(c){return'<option value="'+c+'"'+(c===lang?' selected':'')+'>'+({ar:'العربية',fr:'Français'})[c]+'</option>'}).join("")+'</select>'+(o?'<button class="btn ghost small" onclick="logout()">'+t("logout")+'</button>':'')+'</div>'}

function viewHome(){
 var tb=[["today","today","🏠"],["workers","workers","👷"],["point","point","📲"],["paie","paie","💰"],["plan","plan","🗓"]].map(function(x){return'<div class="tab '+(V.tab===x[0]?'on':'')+'" onclick="setTab(\''+x[0]+'\')"><i>'+x[2]+'</i>'+t(x[1])+'</div>'}).join("");
 $app.innerHTML=topBar(1)+'<div class="tabs">'+tb+'</div><div id="body"><div class="center">…</div></div>';

function setTab(x){V.tab=x;localStorage.setItem("pt_tab",x);render()}
async function loadToday(){
 try{var td=todayIso(),ws=await listDocs("workers");V.workers=ws;try{await loadPlan()}catch(e){}var at=await queryEq("attendance","date",td),by={};at.forEach(function(a){by[a.uid]=a});
 var dow=new Date().getDay(),we=(dow===0||dow===6),pres=ws.filter(function(w){return by[w.id]&&by[w.id].in}).length;
 var rows=ws.slice().sort(function(a,b){return(a.name||"").localeCompare(b.name||"")}).map(function(w){
  var a=by[w.id],chip,info="";
  if(a&&a.in){chip='<span class="chip ok">'+t("present")+'</span>';info=t("inn")+" "+esc(String(a.in).slice(0,5))+(a.out?" — "+t("out")+" "+esc(String(a.out).slice(0,5)):"")}
  else if(we)chip='<span class="chip gr">'+t("rest")+'</span>';else{chip='<span class="chip ko">'+t("absent")+'</span>';info=t("none")}
  var sk=PL[w.id+"_"+wkOf(new Date())],sb=sk?' · '+esc(shN(sk))+' '+SH[sk].i+'-'+SH[sk].o:'';return'<div class="row" onclick="openWorker(\''+esc(w.id)+'\')" style="cursor:pointer">'+av(w.name)+'<div class="grow"><b>'+esc(w.name)+'</b><div class="sub">'+esc(w.mat)+sb+(info?' · '+info:'')+'</div></div>'+chip+'</div>'}).join("");
 var hm=0;at.forEach(function(a){if(a.in)hm+=mins(a.in,a.out||nowHM())});
 document.getElementById("body").innerHTML='<div class="ban"><b>'+new Date().toLocaleDateString(lang==="ar"?"ar-TN":"fr",{weekday:"long",day:"numeric",month:"long",year:"numeric"})+'</b><span>'+f2(hm/60)+' '+t("h")+' · '+pres+'/'+ws.length+' '+t("present")+'</span><div class="bar"><i style="width:'+(ws.length?Math.round(pres/ws.length*100):0)+'%"></i></div></div><div class="grid"><div class="stat"><b>'+ws.length+'</b><span>'+t("workers")+'</span></div><div class="stat"><b>'+pres+'</b><span>'+t("present")+'</span></div><div class="stat"><b>'+(we?0:ws.length-pres)+'</b><span>'+t("absent")+'</span></div></div><div class="card">'+(rows||'<div class="sub">'+t("nw")+'</div>')+'</div>'}catch(e){fail(e)}}
function drawWorkers(){
 var ws=V.workers.slice().sort(function(a,b){return(a.name||"").localeCompare(b.name||"")});
 document.getElementById("body").innerHTML='<div class="actions" style="margin:0 0 10px"><button class="btn acc" onclick="openForm(null)">'+t("add")+'</button></div><div class="card">'+(ws.map(function(w){return'<div class="row" onclick="openWorker(\''+esc(w.id)+'\')" style="cursor:pointer">'+av(w.name)+'<div class="grow"><b>'+esc(w.name)+'</b><div class="sub">'+t("mat")+': '+esc(w.mat)+' · '+esc(w.rate||"0")+' '+t("cur")+'</div></div><span>›</span></div>'}).join("")||'<div class="sub">'+t("nw")+'</div>')+'</div>'}
/* horaires : 3 seances modifiables + affectation hebdomadaire (lundi -> dimanche) */
var SH={1:{i:"06:00",o:"14:00"},2:{i:"14:00",o:"22:00"},3:{i:"22:00",o:"06:00"}},PL={};
function shN(k){return(SH[k]&&SH[k].n)||t("sh")+" "+k}
function wkOf(d){var x=new Date(d);x.setDate(x.getDate()-((x.getDay()+6)%7));return dIso(x)}
async function loadPlan(){
 var c=await api("GET",base()+"/config/shifts");
 if(c){var o=dec(c);[1,2,3].forEach(function(k){SH[k]={n:o["n"+k]||"",i:o["i"+k]||SH[k].i,o:o["o"+k]||SH[k].o}})}
 PL={};(await listDocs("plan")).forEach(function(p){PL[p.uid+"_"+p.week]=p.shift})}
function shiftWeek(n){var d=new Date(V.pw+"T12:00:00");d.setDate(d.getDate()+7*n);V.pw=dIso(d);drawPlan()}
async function drawPlan(){
 try{await loadPlan();V.pw=V.pw||wkOf(new Date());var wk=V.pw;
 var opts=function(v){return'<option value="">—</option>'+[1,2,3].map(function(k){return'<option value="'+k+'"'+(String(v)===String(k)?' selected':'')+'>'+esc(shN(k))+' ('+SH[k].i+'-'+SH[k].o+')</option>'}).join("")};
 var rows=V.workers.slice().sort(function(a,b){return(a.name||"").localeCompare(b.name||"")}).map(function(w){return'<div class="row">'+av(w.name)+'<div class="grow"><b>'+esc(w.name)+'</b><div class="sub">'+esc(w.mat)+'</div></div><select onchange="setPlan(\''+esc(w.id)+'\',this.value)" style="padding:8px;border-radius:9px;max-width:55%">'+opts(PL[w.id+"_"+wk])+'</select></div>'}).join("");
 var ed=[1,2,3].map(function(k){return'<div class="row"><input type="text" id="s_n'+k+'" placeholder="'+esc(shN(k))+'" value="'+esc(SH[k].n||"")+'" style="flex:1.2;padding:8px;border:1px solid var(--line);border-radius:9px"><input type="time" id="s_i'+k+'" value="'+SH[k].i+'" style="flex:1;padding:8px;border:1px solid var(--line);border-radius:9px"><input type="time" id="s_o'+k+'" value="'+SH[k].o+'" style="flex:1;padding:8px;border:1px solid var(--line);border-radius:9px"></div>'}).join("");
 document.getElementById("body").innerHTML='<div class="nav"><button class="btn ghost small" onclick="shiftWeek(-1)">‹</button><b>'+t("wk")+' '+wk+'</b><button class="btn ghost small" onclick="shiftWeek(1)">›</button></div><div class="card">'+(rows||'<div class="sub">'+t("nw")+'</div>')+'</div><div class="card"><b>'+t("shn")+'</b>'+ed+'<div class="actions"><button class="btn ok" onclick="saveShifts()">'+t("save")+'</button></div></div>'}catch(e){fail(e)}}
async function setPlan(id,v){try{await setDoc("plan/"+id+"_"+V.pw,{uid:id,week:V.pw,shift:v});PL[id+"_"+V.pw]=v;toast(true,t("saved"))}catch(e){fail(e)}}
async function saveShifts(){
 var o={},g=function(i){return document.getElementById(i).value.trim()};
 [1,2,3].forEach(function(k){o["n"+k]=g("s_n"+k);o["i"+k]=g("s_i"+k)||SH[k].i;o["o"+k]=g("s_o"+k)||SH[k].o});
 try{await setDoc("config/shifts",o);toast(true,t("saved"));drawPlan()}catch(e){fail(e)}}
/* paie : recap de la periode pour tous */
function calc(w,rec,r){var rate=parseFloat(w.rate)||0,now=new Date(),td=new Date(now.getFullYear(),now.getMonth(),now.getDate()),first=dIso(r[0]),st=(w.start&&w.start>first)?w.start:first,o={h:0,e:0,wk:0,ab:0,days:[]},today=dIso(td);
 for(var d=new Date(r[0]);d<=r[1];d.setDate(d.getDate()+1)){var ds=dIso(d),a=rec[ds],dow=d.getDay(),x={ds:ds,d:new Date(d),k:"f"};
  if(a&&a.in){var end=a.out||(ds===today?nowHM():a.in),hh=mins(a.in,end)/60;o.h+=hh;o.e+=earn(ds,a.in,end,rate);o.wk++;x.k="w";x.h=hh}
  else if(d<=td&&ds>=st&&dow!==0&&dow!==6&&ds!==today){x.k="a";o.ab++}else if(d<=td)x.k="r";
  o.days.push(x)}return o}
async function drawPaie(){
 try{var ws=await listDocs("workers");V.workers=ws;var all=await listDocs("attendance"),by={};all.forEach(function(a){(by[a.uid]=by[a.uid]||{})[a.date]=a});
 curPer();var r=perRange(V.y,V.m),tb=0,tn=0,rows=ws.map(function(w){var c=calc(w,by[w.id]||{},r),p=pay(c.e,w);tb+=p.brut;tn+=p.net;return'<div class="row" onclick="openWorker(\''+esc(w.id)+'\')" style="cursor:pointer">'+av(w.name)+'<div class="grow"><b>'+esc(w.name)+'</b><div class="sub">'+f2(c.h)+' '+t("h")+' · '+c.wk+' '+t("days")+' · '+c.ab+' '+t("abs")+'</div></div><div style="text-align:end"><b>'+f2(p.net)+'</b><div class="sub">'+f2(p.brut)+'</div></div></div>'}).join("");
 document.getElementById("body").innerHTML='<div class="ban"><b>'+t("paie")+'</b><span>'+t("per")+': '+dIso(r[0])+' → '+dIso(r[1])+'</span></div><div class="grid" style="grid-template-columns:1fr 1fr"><div class="stat"><b>'+f2(tb)+'</b><span>'+t("brut")+'</span></div><div class="stat"><b>'+f2(tn)+'</b><span>'+t("net")+'</span></div></div><div class="card">'+(rows||'<div class="sub">'+t("nw")+'</div>')+'</div>'}catch(e){fail(e)}}
/* pointage : carte NFC ou matricule */
function drawPoint(){
 document.getElementById("body").innerHTML='<div class="card"><button class="btn acc" style="width:100%" onclick="nfcPoint()">'+t("nfcon")+'</button><label>'+t("matin")+'</label><input type="text" id="pm"><div class="actions"><button class="btn ok" style="flex:1" onclick="punchMat()">'+t("go")+'</button></div></div>'}
async function nfcPoint(){
 if(!("NDEFReader" in window)){toast(false,t("scan_na"));return}
 try{var r=new NDEFReader();await r.scan();toast(true,t("scanning"));r.onreading=function(ev){punch((ev.serialNumber||"").replace(/:/g,"").toUpperCase())}}catch(e){toast(false,t("scan_na"))}}
function punchMat(){var m=document.getElementById("pm").value.trim(),w=V.workers.filter(function(x){return x.mat===m})[0];if(!w){toast(false,t("unknown"));return}punch(w.id)}
async function punch(id){
 var w=V.workers.filter(function(x){return x.id===id||(x.uid2&&x.uid2===id)})[0];if(!w){toast(false,t("unknown"));return}id=w.id;
 try{var td=todayIso(),p="attendance/"+id+"_"+td,r=await api("GET",base()+"/"+p),a=r?dec(r):null;
  if(!a||!a.in){await setDoc(p,{uid:id,date:td,in:nowHM()});toast(true,t("ent")+" "+w.name+" "+nowHM())}
  else{await setDoc(p,{out:nowHM()});toast(true,t("sor")+" "+w.name+" "+nowHM())}}catch(e){fail(e)}}

var WD={rec:{}};

 loadWorker(w)}
async function loadWorker(w){
 try{try{await loadPlan()}catch(e){}var docs=await queryEq("attendance","uid",w.id),rec={};docs.forEach(function(a){rec[a.date]=a});WD.rec=rec;
 var r=perRange(V.y,V.m),c=calc(w,rec,r),today=todayIso();WD.h=c.h;WD.e=c.e;WD.w=c.wk;
 var hd=t("lun").split(",").map(function(x){return'<div class="hd">'+x+'</div>'}).join(""),lead=(r[0].getDay()+6)%7,html=hd;
 for(var i=0;i<lead;i++)html+='<div class="c z"></div>';
 c.days.forEach(function(x){html+='<div class="c '+x.k+'" onclick="editDay(\''+x.ds+'\')" style="'+(x.ds===today?'outline:2px solid var(--acc)':'')+'"><b>'+x.d.getDate()+'</b>'+(x.k==="w"?f2(x.h)+t("h"):x.k==="a"?'✗':'')+'</div>'});
 document.getElementById("stats").innerHTML='<div class="stat"><b>'+f2(c.h)+'</b><span>'+t("hours")+'</span></div><div class="stat"><b>'+f2(c.e)+'</b><span>'+t("earn")+' ('+t("cur")+')</span></div><div class="stat"><b>'+c.wk+' / '+c.ab+'</b><span>'+t("days")+' / '+t("abs")+'</span></div>';
 document.getElementById("days").innerHTML='<div class="cal">'+html+'</div><div class="leg"><span style="color:var(--ok)">■ '+t("present")+'</span><span style="color:var(--ko)">■ '+t("absent")+'</span><span>✎ tap</span></div><div class="ct">'+t("hours")+'</div><div class="bars">'+c.days.map(function(x){return'<i style="height:'+(x.k==="w"?Math.max(4,Math.min(100,x.h/12*100)):0)+'%"></i>'}).join("")+'</div>'}catch(e){fail(e)}}
function editDay(ds){
 var a=WD.rec[ds]||{},sk=SH[PL[V.wid+"_"+wkOf(new Date(ds+"T12:00:00"))]]||{i:"08:00",o:"16:00"},m=document.createElement("div");m.className="modal";
 m.innerHTML='<div class="card"><b>'+esc(ds)+'</b><label>'+t("inn")+'</label><input type="time" id="t_in" value="'+esc(String(a.in||sk.i).slice(0,5))+'"><label>'+t("out")+'</label><input type="time" id="t_out" value="'+esc(String(a.out||sk.o).slice(0,5))+'"><div class="actions"><button class="btn ok" id="d_save">'+t("save")+'</button><button class="btn ko" id="d_clear">'+t("clear")+'</button><button class="btn gray" id="d_cancel">'+t("cancel")+'</button></div></div>';

 var w=V.workers.filter(function(x){return x.id===V.wid})[0],p=pay(WD.e||0,w),r=perRange(V.y,V.m),done=new Date()>r[1],m=document.createElement("div");m.className="modal";
 var fl=function(a,b,c){return'<div class="fl'+(c?' t':'')+'"><span>'+a+'</span><span>'+f2(b)+' '+t("cur")+'</span></div>'};

function viewForm(){

function openForm(id){V.edit=!!id;V.wid=id||null;V.view="form";render()}
async function scanNfc(tid){
 if(!("NDEFReader" in window)){toast(false,t("scan_na"));return}
 try{var r=new NDEFReader();await r.scan();toast(true,t("scanning"));r.onreading=function(ev){var s=(ev.serialNumber||"").replace(/:/g,"").toUpperCase();if(s){document.getElementById(tid).value=s;toast(true,s)}}}catch(e){toast(false,t("scan_na"))}}
async function saveWorker(){
 var g=function(i){return document.getElementById(i).value.trim()},name=g("f_name"),uid=g("f_uid").toUpperCase().replace(/[^0-9A-F]/g,""),
 o={name:name,mat:g("f_mat"),rate:g("f_rate").replace(",","."),chef:g("f_chef"),enf:g("f_enf")||"0",uid2:g("f_uid2").toUpperCase().replace(/[^0-9A-F]/g,"")};
 if(!name||!uid){toast(false,t("need"));return}
 try{
  if(!V.edit||uid!==V.wid){if(await api("GET",base()+"/workers/"+uid)){toast(false,t("used"));return}}
  if(!V.edit)o.start=todayIso();
  else if(uid!==V.wid){ /* carte remplacée : on déplace le worker et ses pointages vers le nouvel UID */
   var old=V.workers.filter(function(x){return x.id===V.wid})[0];o.start=old.start||todayIso();
   var at=await queryEq("attendance","uid",V.wid);
   for(var i=0;i<at.length;i++){await setDoc("attendance/"+uid+"_"+at[i].date,{uid:uid,date:at[i].date,in:at[i].in,out:at[i].out});await delDoc("attendance/"+at[i].id)}
   await setDoc("workers/"+uid,o);await delDoc("workers/"+V.wid);toast(true,t("changed"))}
  if(!V.edit||uid===V.wid)await setDoc("workers/"+uid,o);
  V.workers=await listDocs("workers");V.view="home";V.tab="workers";render();toast(true,t("saved"))}catch(e){fail(e)}}
async function removeWorker(){
 if(!confirm(t("confirm_del")))return;
 try{await delDoc("workers/"+V.wid);V.workers=await listDocs("workers");V.view="home";V.tab="workers";render();toast(true,t("saved"))}catch(e){fail(e)}}
async function boot(){
 if(cfg.pid&&cfg.key&&localStorage.getItem("pt_rt")){
  $app.innerHTML='<div class="center" style="padding:60px">…</div>';
  try{V.workers=await listDocs("workers");V.view="home";V.tab=localStorage.getItem("pt_tab")||"today"}catch(e){V.view="login"}}
 render()}
boot();
</script></body></html>
